name: Validate artifact

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[agent]'
      - run: python -m pytest tests -q
      - run: backendforge validate --collect
      - name: Verify wheel installation
        run: |
          pip wheel . --wheel-dir dist
          python -m venv /tmp/backendforge-wheel
          /tmp/backendforge-wheel/bin/pip install dist/backendforge_benchmark-*.whl
          cd /tmp
          /tmp/backendforge-wheel/bin/backendforge-agent --help
          /tmp/backendforge-wheel/bin/backendforge validate --collect
