components:
  schemas:
    CategorySummary:
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
      type: object
      required:
      - id
      - slug
      - name
    IngredientFood:
      properties:
        id:
          type: string
        name:
          type: string
        pluralName:
          type: string
          nullable: true
        description:
          type: string
        extras:
          additionalProperties: true
          type: object
          nullable: true
        labelId:
          type: string
          nullable: true
        aliases:
          items:
            properties:
              name:
                type: string
            type: object
            required:
            - name
          type: array
        householdsWithIngredientFood:
          items:
            type: string
          type: array
        label:
          $ref: '#/components/schemas/MultiPurposeLabelSummary'
          nullable: true
        createdAt:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
      type: object
      required:
      - id
      - name
    IngredientUnit:
      properties:
        id:
          type: string
        name:
          type: string
        pluralName:
          type: string
          nullable: true
        description:
          type: string
        extras:
          additionalProperties: true
          type: object
          nullable: true
        fraction:
          type: boolean
        abbreviation:
          type: string
        pluralAbbreviation:
          type: string
          nullable: true
        useAbbreviation:
          type: boolean
        aliases:
          items:
            properties:
              name:
                type: string
            type: object
            required:
            - name
          type: array
        standardQuantity:
          type: number
          nullable: true
        standardUnit:
          type: string
          nullable: true
        createdAt:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
      type: object
      required:
      - id
      - name
    MultiPurposeLabelSummary:
      properties:
        name:
          type: string
        color:
          type: string
        groupId:
          type: string
        id:
          type: string
      type: object
      required:
      - name
      - groupId
      - id
    Nutrition:
      type: object
      description: 'All fields are nullable strings: calories, fatContent, proteinContent, carbohydrateContent, fiberContent,
        sodiumContent, sugarContent, cholesterolContent, saturatedFatContent, transFatContent, unsaturatedFatContent'
    PlanRulesOut:
      properties:
        day:
          type: string
          enum:
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          - sunday
          - unset
        entryType:
          type: string
          enum:
          - breakfast
          - lunch
          - dinner
          - side
          - snack
          - drink
          - dessert
          - unset
        queryFilterString:
          type: string
        groupId:
          type: string
        householdId:
          type: string
        id:
          type: string
        queryFilter:
          $ref: '#/components/schemas/QueryFilterJSON'
      type: object
      required:
      - groupId
      - householdId
      - id
    QueryFilterJSON:
      type: object
      description: 'Filter expression: {parts: [{leftParenthesis?, attributeName, relationalOperator (CONTAINS_ALL|IS|IN|NOT_IN|CONTAINS_ANY|like|>|<|>=|<=|<>|=),
        value (string or array of strings), logicalOperator? (AND|OR), rightParenthesis?}]}'
    ReadCookBook:
      properties:
        name:
          type: string
        description:
          type: string
        slug:
          type: string
          nullable: true
        position:
          type: integer
        public:
          type: boolean
        queryFilterString:
          type: string
        groupId:
          type: string
        householdId:
          type: string
        id:
          type: string
        queryFilter:
          $ref: '#/components/schemas/QueryFilterJSON'
        household:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
      type: object
      required:
      - name
      - groupId
      - householdId
      - id
    ReadPlanEntry:
      properties:
        date:
          type: string
        entryType:
          type: string
          enum:
          - breakfast
          - lunch
          - dinner
          - side
          - snack
          - drink
          - dessert
        title:
          type: string
        text:
          type: string
        recipeId:
          type: string
          nullable: true
        id:
          type: integer
        groupId:
          type: string
        userId:
          type: string
        householdId:
          type: string
        recipe:
          $ref: '#/components/schemas/RecipeSummary'
          nullable: true
      type: object
      required:
      - date
      - id
      - groupId
      - userId
      - householdId
    Recipe:
      description: Extends RecipeSummary with detail fields
      allOf:
      - $ref: '#/components/schemas/RecipeSummary'
      - type: object
        properties:
          recipeIngredient:
            items:
              $ref: '#/components/schemas/RecipeIngredient'
            type: array
          recipeInstructions:
            items:
              $ref: '#/components/schemas/RecipeStep'
            type: array
            nullable: true
          nutrition:
            $ref: '#/components/schemas/Nutrition'
            nullable: true
          settings:
            $ref: '#/components/schemas/RecipeSettings'
            nullable: true
          assets:
            items:
              $ref: '#/components/schemas/RecipeAsset'
            type: array
            nullable: true
          notes:
            items:
              $ref: '#/components/schemas/RecipeNote'
            type: array
            nullable: true
          extras:
            additionalProperties: true
            type: object
            nullable: true
          comments:
            items:
              $ref: '#/components/schemas/RecipeCommentOut'
            type: array
            nullable: true
    RecipeAsset:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
        fileName:
          type: string
          nullable: true
      required:
      - name
      - icon
    RecipeCategory:
      properties:
        id:
          type: string
          nullable: true
        groupId:
          type: string
          nullable: true
        name:
          type: string
        slug:
          type: string
      type: object
      required:
      - name
      - slug
    RecipeCommentOut:
      properties:
        recipeId:
          type: string
        text:
          type: string
        id:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        userId:
          type: string
        user:
          $ref: '#/components/schemas/UserBase'
      type: object
      required:
      - recipeId
      - text
      - id
      - createdAt
      - updatedAt
      - userId
      - user
    RecipeIngredient:
      properties:
        quantity:
          type: number
          nullable: true
        unit:
          anyOf:
          - $ref: '#/components/schemas/IngredientUnit'
          - $ref: '#/components/schemas/IngredientUnit'
        food:
          anyOf:
          - $ref: '#/components/schemas/IngredientFood'
          - $ref: '#/components/schemas/IngredientFood'
        referencedRecipe:
          $ref: '#/components/schemas/Recipe'
          nullable: true
        note:
          type: string
          nullable: true
        display:
          type: string
        title:
          type: string
          nullable: true
        originalText:
          type: string
          nullable: true
        referenceId:
          type: string
      type: object
    RecipeNote:
      properties:
        title:
          type: string
        text:
          type: string
      type: object
      required:
      - title
      - text
    RecipeSettings:
      type: object
      description: 'All fields are booleans: public, showNutrition, showAssets, landscapeView, disableComments, locked'
    RecipeStep:
      properties:
        id:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        text:
          type: string
        ingredientReferences:
          items:
            properties:
              referenceId:
                type: string
                nullable: true
            type: object
          type: array
      type: object
      required:
      - text
    RecipeSuggestionResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/RecipeSuggestionResponseItem'
          type: array
      type: object
      required:
      - items
    RecipeSuggestionResponseItem:
      properties:
        recipe:
          $ref: '#/components/schemas/RecipeSummary'
        missingFoods:
          items:
            $ref: '#/components/schemas/IngredientFood'
          type: array
        missingTools:
          items:
            $ref: '#/components/schemas/RecipeTool'
          type: array
      type: object
      required:
      - recipe
      - missingFoods
      - missingTools
    RecipeSummary:
      properties:
        id:
          type: string
          nullable: true
        userId:
          type: string
        householdId:
          type: string
        groupId:
          type: string
        name:
          type: string
          nullable: true
        slug:
          type: string
        image:
          nullable: true
        recipeServings:
          type: number
        recipeYieldQuantity:
          type: number
        recipeYield:
          type: string
          nullable: true
        totalTime:
          type: string
          nullable: true
        prepTime:
          type: string
          nullable: true
        cookTime:
          type: string
          nullable: true
        performTime:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        recipeCategory:
          items:
            $ref: '#/components/schemas/RecipeCategory'
          type: array
          nullable: true
        tags:
          items:
            $ref: '#/components/schemas/RecipeTag'
          type: array
          nullable: true
        tools:
          items:
            $ref: '#/components/schemas/RecipeTool'
          type: array
        rating:
          type: number
          nullable: true
        orgURL:
          type: string
          nullable: true
        dateAdded:
          type: string
          nullable: true
        dateUpdated:
          type: string
          nullable: true
        createdAt:
          type: string
          nullable: true
