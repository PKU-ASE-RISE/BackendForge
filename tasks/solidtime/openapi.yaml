openapi: 3.0.3
info:
  title: Solidtime REST-API
  description: Modern time-tracking application
  version: "1.0.0"

servers:
  - url: http://localhost:8000

components:
  schemas:
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string

    Organization:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        billable_rate:
          type: integer
          nullable: true
          description: Default hourly rate in cents for the organization

    OrganizationUpdate:
      type: object
      properties:
        name:
          type: string
        billable_rate:
          type: integer
          nullable: true

    Member:
      type: object
      required:
        - id
        - user_id
        - organization_id
        - role
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member]
        billable_rate:
          type: integer
          nullable: true
          description: Hourly rate in cents for this member

    MemberCreate:
      type: object
      required:
        - user_id
        - role
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member]
        billable_rate:
          type: integer
          nullable: true

    MemberUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [owner, admin, member]
        billable_rate:
          type: integer
          nullable: true

    Client:
      type: object
      required:
        - id
        - name
        - organization_id
        - archived
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        organization_id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClientCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        email:
          type: string
          nullable: true
        address:
          type: string
          nullable: true

    ClientUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        archived:
          type: boolean

    Project:
      type: object
      required:
        - id
        - name
        - organization_id
        - is_billable
        - archived
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        organization_id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
          nullable: true
        color:
          type: string
          description: "Hex color (e.g., #FF5733)"
        is_billable:
          type: boolean
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required:
        - name
        - color
        - is_billable
      properties:
        name:
          type: string
        color:
          type: string
        client_id:
          type: string
          format: uuid
          nullable: true
        is_billable:
          type: boolean

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
        client_id:
          type: string
          format: uuid
          nullable: true
        is_billable:
          type: boolean
        archived:
          type: boolean

    Task:
      type: object
      required:
        - id
        - name
        - project_id
        - done
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        project_id:
          type: string
          format: uuid
        done:
          type: boolean
        estimated_seconds:
          type: integer
          nullable: true
        spent_seconds:
          type: integer
          description: Total duration of all time entries for this task
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskCreate:
      type: object
      required:
        - name
        - project_id
      properties:
        name:
          type: string
        project_id:
          type: string
          format: uuid
        estimated_seconds:
          type: integer
          nullable: true

    TaskUpdate:
      type: object
      properties:
        name:
          type: string
        done:
          type: boolean
        estimated_seconds:
          type: integer
          nullable: true

    Tag:
      type: object
      required:
        - id
        - name
        - organization_id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        organization_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TagCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    TagUpdate:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    TimeEntry:
      type: object
      required:
        - id
        - user_id
        - organization_id
        - start
        - billable
        - duration
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        task_id:
          type: string
          format: uuid
          nullable: true
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          nullable: true
        duration:
          type: integer
          description: Duration in seconds. Computed from end-start or now-start for running timers.
        description:
          type: string
          nullable: true
        billable:
          type: boolean
        billable_amount:
          type: number
          format: float
          description: Computed billable amount based on duration and rate
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    TimeEntryCreate:
      type: object
      required:
        - start
        - billable
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          nullable: true
        description:
          type: string
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        task_id:
          type: string
          format: uuid
          nullable: true
        billable:
          type: boolean
        tag_ids:
          type: array
          items:
            type: string
            format: uuid

    TimeEntryUpdate:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          nullable: true
        description:
          type: string
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        task_id:
          type: string
          format: uuid
          nullable: true
        billable:
          type: boolean
        tag_ids:
          type: array
          items:
            type: string
            format: uuid

    TimerStart:
      type: object
      required:
        - start
        - billable
      properties:
        start:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        task_id:
          type: string
          format: uuid
          nullable: true
        billable:
          type: boolean
        tag_ids:
          type: array
          items:
            type: string
            format: uuid

    TimerStop:
      type: object
      required:
        - end
      properties:
        end:
          type: string
          format: date-time

    ReportTime:
      type: object
      required:
        - total_seconds
        - total_billable_seconds
        - total_billable_amount
        - entry_count
      properties:
        total_seconds:
          type: integer
        total_billable_seconds:
          type: integer
        total_billable_amount:
          type: number
          format: float
        entry_count:
          type: integer

    ReportProject:
      type: object
      required:
        - project_id
        - project_name
        - total_seconds
        - total_billable_seconds
        - total_billable_amount
        - entry_count
      properties:
        project_id:
          type: string
          format: uuid
          nullable: true
        project_name:
          type: string
          nullable: true
        total_seconds:
          type: integer
        total_billable_seconds:
          type: integer
        total_billable_amount:
          type: number
          format: float
        entry_count:
          type: integer

    ReportMember:
      type: object
      required:
        - user_id
        - total_seconds
        - total_billable_seconds
        - total_billable_amount
        - entry_count
      properties:
        user_id:
          type: string
          format: uuid
        total_seconds:
          type: integer
        total_billable_seconds:
          type: integer
        total_billable_amount:
          type: number
          format: float
        entry_count:
          type: integer

    ReportDaily:
      type: object
      required:
        - date
        - total_seconds
        - total_billable_seconds
        - total_billable_amount
        - entry_count
      properties:
        date:
          type: string
          format: date
          description: "Date in YYYY-MM-DD format"
        total_seconds:
          type: integer
        total_billable_seconds:
          type: integer
        total_billable_amount:
          type: number
          format: float
        entry_count:
          type: integer

paths:
  /api/v1/organizations/current:
    get:
      operationId: getOrganization
      summary: Get current organization
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateOrganization
      summary: Update current organization
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/members:
    get:
      operationId: listMembers
      summary: List members of current organization
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createMember
      summary: Add a member to the organization
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreate'
      responses:
        "201":
          description: Created member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Member already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/members/{id}:
    put:
      operationId: updateMember
      summary: Update a member
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteMember
      summary: Remove a member from the organization
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Member removed
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Cannot remove owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/clients:
    get:
      operationId: listClients
      summary: List clients
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by archived status
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createClient
      summary: Create a client
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Client name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/clients/{id}:
    put:
      operationId: updateClient
      summary: Update a client
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdate'
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Client name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteClient
      summary: Delete a client
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Client deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by archived status
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createProject
      summary: Create a project
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Project name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Validation error (e.g., archived client, invalid color)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/projects/{id}:
    get:
      operationId: getProject
      summary: Get a project
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateProject
      summary: Update a project
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Project name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteProject
      summary: Delete a project
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Project deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: List tasks
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Org-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: done
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of tasks
          content:
