openapi: 3.0.3
info:
  title: Strapi Headless CMS API
  description: A headless CMS with dynamic content types, relations, components, media, localization, and role-based access control.
  version: 1.0.0

servers:
  - url: http://localhost:8000

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            status:
              type: integer
            name:
              type: string
            message:
              type: string

    ContentType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        settings:
          type: object
          properties:
            draftAndPublish:
              type: boolean
            localization:
              type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContentTypeCreate:
      type: object
      required:
        - name
        - displayName
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        displayName:
          type: string
        description:
          type: string
        settings:
          type: object
          properties:
            draftAndPublish:
              type: boolean
              default: false
            localization:
              type: boolean
              default: false

    ContentTypeUpdate:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
        settings:
          type: object
          properties:
            draftAndPublish:
              type: boolean
            localization:
              type: boolean

    Field:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [text, number, boolean, date, enum, relation, json, media, component]
        required:
          type: boolean
        unique:
          type: boolean
        default:
          nullable: true
        enumValues:
          type: array
          items:
            type: string
        target:
          type: string
        relationType:
          type: string
          enum: [oneToOne, oneToMany, manyToMany]
        component:
          type: string

    FieldCreate:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          enum: [text, number, boolean, date, enum, relation, json, media, component]
        required:
          type: boolean
          default: false
        unique:
          type: boolean
          default: false
        default:
          nullable: true
        enumValues:
          type: array
          items:
            type: string
        target:
          type: string
        relationType:
          type: string
          enum: [oneToOne, oneToMany, manyToMany]
        component:
          type: string

    FieldUpdate:
      type: object
      properties:
        required:
          type: boolean
        unique:
          type: boolean
        default:
          nullable: true
        enumValues:
          type: array
          items:
            type: string

    Entry:
      type: object
      properties:
        id:
          type: integer
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        locale:
          type: string
      additionalProperties: true

    EntryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                page:
                  type: integer
                pageSize:
                  type: integer
                pageCount:
                  type: integer
                total:
                  type: integer

    Component:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ComponentCreate:
      type: object
      required:
        - name
        - displayName
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldCreate'

    ComponentUpdate:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string

    MediaFile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
        mimeType:
          type: string
        size:
          type: number
        folder:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MediaFolder:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        parentId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time

    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          enum: [admin, editor, author]
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    Permission:
      type: object
      properties:
        contentType:
          type: string
        actions:
          type: array
          items:
            type: string
            enum: [create, read, update, delete]

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
        createdAt:
          type: string
          format: date-time

    UserCreate:
      type: object
      required:
        - username
        - email
        - role
      properties:
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, editor, author]

    ApiToken:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        token:
          type: string
        type:
          type: string
          enum: [read-only, full-access, custom]
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        createdAt:
          type: string
          format: date-time

    ApiTokenCreate:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          enum: [read-only, full-access, custom]
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    Webhook:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
            enum: [entry.create, entry.update, entry.delete]
        enabled:
          type: boolean
        contentTypes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    WebhookCreate:
      type: object
      required:
        - name
        - url
        - events
      properties:
        name:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
            enum: [entry.create, entry.update, entry.delete]
        enabled:
          type: boolean
          default: true
        contentTypes:
          type: array
          items:
            type: string

    Locale:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time

    LocaleCreate:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string

paths:
  # ─── Content Types ───────────────────────────────────────────────
  /content-types:
    get:
      operationId: listContentTypes
      summary: List all content types
      tags: [Content Types]
      responses:
        '200':
          description: List of content types
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentType'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createContentType
      summary: Create a new content type
      tags: [Content Types]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentTypeCreate'
      responses:
        '201':
          description: Content type created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContentType'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '409':
          description: Name already exists

  /content-types/{id}:
    get:
      operationId: getContentType
      summary: Get a content type by ID
      tags: [Content Types]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Content type details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContentType'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      operationId: updateContentType
      summary: Update a content type
      tags: [Content Types]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentTypeUpdate'
      responses:
        '200':
          description: Content type updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContentType'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      operationId: deleteContentType
      summary: Delete a content type
      tags: [Content Types]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  # ─── Fields ──────────────────────────────────────────────────────
  /content-types/{contentTypeId}/fields:
    get:
      operationId: listFields
      summary: List fields of a content type
      tags: [Fields]
      parameters:
        - name: contentTypeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Field'
        '401':
          description: Unauthorized
        '404':
          description: Content type not found
    post:
      operationId: addField
      summary: Add a field to a content type
      tags: [Fields]
      parameters:
        - name: contentTypeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldCreate'
      responses:
        '201':
          description: Field added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Field'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Content type not found
        '409':
          description: Field name already exists

  /content-types/{contentTypeId}/fields/{fieldId}:
    put:
      operationId: updateField
      summary: Update a field
      tags: [Fields]
      parameters:
        - name: contentTypeId
          in: path
          required: true
          schema:
            type: integer
        - name: fieldId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldUpdate'
      responses:
        '200':
          description: Field updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Field'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      operationId: deleteField
      summary: Delete a field from a content type
      tags: [Fields]
      parameters:
        - name: contentTypeId
          in: path
          required: true
          schema:
            type: integer
        - name: fieldId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Field deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  # ─── Dynamic Content Entries ─────────────────────────────────────
  /content/{contentTypeName}:
    get:
      operationId: listEntries
      summary: List entries of a content type
      tags: [Entries]
      parameters:
        - name: contentTypeName
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          schema:
            type: string
          description: "Sort field and direction, e.g. title:asc"
        - name: locale
          in: query
          schema:
            type: string
        - name: filters
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: true
          description: "Filters in format filters[field][operator]=value"
      responses:
        '200':
          description: Paginated list of entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryListResponse'
        '401':
          description: Unauthorized
        '404':
          description: Content type not found
    post:
      operationId: createEntry
      summary: Create a new entry
      tags: [Entries]
      parameters:
        - name: contentTypeName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Entry'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Content type not found
        '409':
          description: Unique constraint violation

  /content/{contentTypeName}/{entryId}:
    get:
      operationId: getEntry
      summary: Get an entry by ID
      tags: [Entries]
      parameters:
        - name: contentTypeName
          in: path
          required: true
          schema:
            type: string
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Entry details with populated relations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Entry'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      operationId: updateEntry
      summary: Update an entry
      tags: [Entries]
      parameters:
        - name: contentTypeName
          in: path
          required: true
          schema:
            type: string
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Entry updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Entry'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: Unique constraint violation
    delete:
      operationId: deleteEntry
      summary: Delete an entry
      tags: [Entries]
      parameters:
        - name: contentTypeName
          in: path
          required: true
          schema:
            type: string
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  # ─── Localized Entries ───────────────────────────────────────────
  /content/{contentTypeName}/{entryId}/localizations:
    post:
      operationId: createLocalization
      summary: Create a localized version of an entry
      tags: [Entries]
      parameters:
        - name: contentTypeName
          in: path
          required: true
          schema:
            type: string
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - locale
              properties:
                locale:
                  type: string
              additionalProperties: true
      responses:
        '201':
          description: Localized entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Entry'
        '400':
          description: Validation error (locale already exists, localization not enabled)
        '401':
          description: Unauthorized
        '404':
          description: Entry not found

  # ─── Components ──────────────────────────────────────────────────
  /components:
    get:
      operationId: listComponents
      summary: List all components
      tags: [Components]
      responses:
        '200':
          description: List of components
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Component'
        '401':
          description: Unauthorized
    post:
      operationId: createComponent
      summary: Create a new component
      tags: [Components]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentCreate'
      responses:
        '201':
          description: Component created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Component'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Name already exists

  /components/{id}:
    get:
      operationId: getComponent
      summary: Get a component by ID
      tags: [Components]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Component details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Component'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      operationId: updateComponent
      summary: Update a component
      tags: [Components]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentUpdate'
      responses:
        '200':
          description: Component updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Component'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      operationId: deleteComponent
      summary: Delete a component
      tags: [Components]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /components/{componentId}/fields:
    post:
      operationId: addComponentField
      summary: Add a field to a component
      tags: [Components]
      parameters:
        - name: componentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldCreate'
      responses:
        '201':
          description: Field added to component
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Field'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Component not found
        '409':
          description: Field name already exists

  /components/{componentId}/fields/{fieldId}:
    delete:
      operationId: deleteComponentField
      summary: Delete a field from a component
      tags: [Components]
      parameters:
        - name: componentId
          in: path
          required: true
          schema:
            type: integer
        - name: fieldId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Field deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  # ─── Media Library ───────────────────────────────────────────────
  /media:
    get:
      operationId: listMedia
      summary: List all media files
      tags: [Media]
      parameters:
        - name: folder
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of media files
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaFile'
        '401':
          description: Unauthorized
    post:
      operationId: uploadMedia
      summary: Upload a media file
      tags: [Media]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                folder:
                  type: string
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MediaFile'
        '400':
          description: No file provided
        '401':
          description: Unauthorized

  /media/{id}:
    get:
      operationId: getMedia
      summary: Get a media file by ID
      tags: [Media]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Media file details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MediaFile'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    delete:
      operationId: deleteMedia
      summary: Delete a media file
      tags: [Media]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /media/folders:
    get:
      operationId: listMediaFolders
      summary: List media folders
      tags: [Media]
      responses:
        '200':
          description: List of folders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaFolder'
        '401':
          description: Unauthorized
    post:
      operationId: createMediaFolder
      summary: Create a media folder
