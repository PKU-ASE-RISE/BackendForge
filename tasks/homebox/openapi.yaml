openapi: 3.0.3
info:
  title: Homebox REST-API
  description: Home inventory management system
  version: "1.0.0"

servers:
  - url: http://localhost:8000

security:
  - UserAuth: []

components:
  securitySchemes:
    UserAuth:
      type: apiKey
      in: header
      name: X-User-Id
      description: UUID identifying the user (also requires X-Group-Id header)

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    Item:
      type: object
      required:
        - id
        - name
        - quantity
        - archived
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        description:
          type: string
          default: ""
        quantity:
          type: integer
          minimum: 1
          default: 1
        serialNumber:
          type: string
          default: ""
        modelNumber:
          type: string
          default: ""
        manufacturer:
          type: string
          default: ""
        purchasePrice:
          type: number
          format: float
          default: 0
        purchaseDate:
          type: string
          format: date
          nullable: true
        warrantyExpires:
          type: string
          format: date
          nullable: true
        locationId:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string
          default: ""
        archived:
          type: boolean
          default: false
        labels:
          type: array
          items:
            $ref: '#/components/schemas/LabelSummary'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    ItemCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          default: ""
        quantity:
          type: integer
          minimum: 1
          default: 1
        serialNumber:
          type: string
          default: ""
        modelNumber:
          type: string
          default: ""
        manufacturer:
          type: string
          default: ""
        purchasePrice:
          type: number
          format: float
          default: 0
        purchaseDate:
          type: string
          format: date
          nullable: true
        warrantyExpires:
          type: string
          format: date
          nullable: true
        locationId:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string
          default: ""

    ItemUpdate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        quantity:
          type: integer
          minimum: 1
        serialNumber:
          type: string
        modelNumber:
          type: string
        manufacturer:
          type: string
        purchasePrice:
          type: number
          format: float
        purchaseDate:
          type: string
          format: date
          nullable: true
        warrantyExpires:
          type: string
          format: date
          nullable: true
        locationId:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string

    ItemList:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    Location:
      type: object
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        description:
          type: string
          default: ""
        parentId:
          type: string
          format: uuid
          nullable: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/LocationSummary'
          readOnly: true
        itemCount:
          type: integer
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    LocationSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    LocationCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          default: ""
        parentId:
          type: string
          format: uuid
          nullable: true

    LocationUpdate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true

    Label:
      type: object
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        description:
          type: string
          default: ""
        color:
          type: string
          default: ""
        itemCount:
          type: integer
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    LabelSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string

    LabelCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          default: ""
        color:
          type: string
          default: ""

    LabelUpdate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        color:
          type: string

    Attachment:
      type: object
      required:
        - id
        - name
        - type
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        type:
          type: string
          enum:
            - manual
            - receipt
            - warranty
            - photo
        createdAt:
          type: string
          format: date-time
          readOnly: true

    AttachmentCreate:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - manual
            - receipt
            - warranty
            - photo

    AttachmentUpdate:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - manual
            - receipt
            - warranty
            - photo

    MaintenanceEntry:
      type: object
      required:
        - id
        - date
        - description
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        date:
          type: string
          format: date
        description:
          type: string
        cost:
          type: number
          format: float
          default: 0
        scheduledDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true

    MaintenanceCreate:
      type: object
      required:
        - date
        - description
      properties:
        date:
          type: string
          format: date
        description:
          type: string
        cost:
          type: number
          format: float
          default: 0
        scheduledDate:
          type: string
          format: date
          nullable: true

    MaintenanceUpdate:
      type: object
      required:
        - date
        - description
      properties:
        date:
          type: string
          format: date
        description:
          type: string
        cost:
          type: number
          format: float
        scheduledDate:
          type: string
          format: date
          nullable: true

    Statistics:
      type: object
      required:
        - totalItems
        - totalValue
        - itemsByLocation
        - itemsByLabel
      properties:
        totalItems:
          type: integer
        totalValue:
          type: number
          format: float
        itemsByLocation:
          type: array
          items:
            type: object
            required:
              - locationId
              - locationName
              - itemCount
            properties:
              locationId:
                type: string
                format: uuid
              locationName:
                type: string
              itemCount:
                type: integer
        itemsByLabel:
          type: array
          items:
            type: object
            required:
              - labelId
              - labelName
              - itemCount
            properties:
              labelId:
                type: string
                format: uuid
              labelName:
                type: string
              itemCount:
                type: integer

    ImportResult:
      type: object
      required:
        - imported
      properties:
        imported:
          type: integer

    ExportItem:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        quantity:
          type: integer
        serialNumber:
          type: string
        modelNumber:
          type: string
        manufacturer:
          type: string
        purchasePrice:
          type: number
          format: float
        purchaseDate:
          type: string
          format: date
          nullable: true
        warrantyExpires:
          type: string
          format: date
          nullable: true
        locationName:
          type: string
        labelNames:
          type: string
        notes:
          type: string

    ArchiveRequest:
      type: object
      required:
        - archived
      properties:
        archived:
          type: boolean

    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

paths:
  /health:
    get:
      operationId: getHealth
      summary: Get health status
      security: []
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /items:
    get:
      operationId: listItems
      summary: List items with filtering, search, and pagination
      parameters:
        - name: q
          in: query
          description: Search term (matches name, description, serialNumber, modelNumber)
          schema:
            type: string
        - name: labels
          in: query
          description: Comma-separated label IDs to filter by (OR logic)
          schema:
            type: string
        - name: locationId
          in: query
          description: Filter by location ID
          schema:
            type: string
            format: uuid
        - name: archived
          in: query
          description: "Filter archived items: 'true' = only archived, 'false' = only non-archived (default), 'all' = both"
          schema:
            type: string
            default: "false"
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated list of items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createItem
      summary: Create a new item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
      responses:
        "201":
          description: The created item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /items/{id}:
    get:
      operationId: getItem
      summary: Get item details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateItem
      summary: Update an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdate'
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteItem
      summary: Delete an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Item deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /items/{id}/archive:
    patch:
      operationId: archiveItem
      summary: Archive or unarchive an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRequest'
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /items/{id}/labels:
    post:
      operationId: addItemLabel
      summary: Attach a label to an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - labelId
              properties:
                labelId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        "400":
          description: Bad Request (label not found or already attached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /items/{id}/labels/{labelId}:
    delete:
      operationId: removeItemLabel
      summary: Detach a label from an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: labelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Item or label association not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /items/{id}/attachments:
    get:
      operationId: listAttachments
      summary: List attachments for an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Array of attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createAttachment
      summary: Create an attachment for an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentCreate'
      responses:
        "201":
          description: The created attachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        "400":
          description: Bad Request (invalid type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /items/{id}/attachments/{attachmentId}:
    put:
      operationId: updateAttachment
      summary: Update an attachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentUpdate'
      responses:
        "200":
          description: The updated attachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        "400":
          description: Bad Request (invalid type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Item or attachment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteAttachment
      summary: Delete an attachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Attachment deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Item or attachment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /items/{id}/maintenance:
    get:
      operationId: listMaintenance
      summary: List maintenance entries for an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Array of maintenance entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceEntry'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createMaintenance
      summary: Create a maintenance entry for an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceCreate'
      responses:
        "201":
          description: The created maintenance entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceEntry'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /items/{id}/maintenance/{maintenanceId}:
    put:
      operationId: updateMaintenance
      summary: Update a maintenance entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: maintenanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceUpdate'
      responses:
        "200":
          description: The updated maintenance entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceEntry'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Item or maintenance entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteMaintenance
      summary: Delete a maintenance entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: maintenanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Maintenance entry deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Item or maintenance entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /locations:
    get:
      operationId: listLocations
      summary: List all locations
      responses:
        "200":
          description: Array of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createLocation
      summary: Create a location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationCreate'
      responses:
        "201":
          description: The created location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Conflict (duplicate name in same parent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /locations/{id}:
    get:
      operationId: getLocation
      summary: Get location details with children and item count
      parameters:
