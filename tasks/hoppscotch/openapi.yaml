openapi: 3.0.3
info:
  title: Hoppscotch API
  description: API development platform with collections, environments, teams, and request history.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local development server

security:
  - apiKeyAuth: []

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: User ID used as API key

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Header:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        active:
          type: boolean
          default: true
      required:
        - key
        - value

    Param:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        active:
          type: boolean
          default: true
      required:
        - key
        - value

    RequestBody:
      type: object
      properties:
        contentType:
          type: string
          example: application/json
        content:
          type: string
      required:
        - contentType
        - content

    Auth:
      type: object
      properties:
        type:
          type: string
          enum: [none, basic, bearer, api-key]
        token:
          type: string
        username:
          type: string
        password:
          type: string
        key:
          type: string
        value:
          type: string
        addTo:
          type: string
          enum: [header, query]
      required:
        - type

    Variable:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        active:
          type: boolean
          default: true
      required:
        - key
        - value

    Collection:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        parentId:
          type: string
          nullable: true
        order:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - order
        - createdAt
        - updatedAt

    CollectionCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        parentId:
          type: string
          nullable: true
        order:
          type: integer
      required:
        - name

    CollectionUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        order:
          type: integer

    Request:
      type: object
      properties:
        id:
          type: string
        collectionId:
          type: string
        name:
          type: string
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
        url:
          type: string
        headers:
          type: array
          items:
            $ref: '#/components/schemas/Header'
        params:
          type: array
          items:
            $ref: '#/components/schemas/Param'
        body:
          $ref: '#/components/schemas/RequestBody'
        auth:
          $ref: '#/components/schemas/Auth'
        preRequestScript:
          type: string
        testScript:
          type: string
        order:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - collectionId
        - name
        - method
        - url
        - order
        - createdAt
        - updatedAt

    RequestCreate:
      type: object
      properties:
        collectionId:
          type: string
        name:
          type: string
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
        url:
          type: string
        headers:
          type: array
          items:
            $ref: '#/components/schemas/Header'
        params:
          type: array
          items:
            $ref: '#/components/schemas/Param'
        body:
          $ref: '#/components/schemas/RequestBody'
        auth:
          $ref: '#/components/schemas/Auth'
        preRequestScript:
          type: string
        testScript:
          type: string
        order:
          type: integer
      required:
        - collectionId
        - name
        - method
        - url

    RequestUpdate:
      type: object
      properties:
        name:
          type: string
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
        url:
          type: string
        headers:
          type: array
          items:
            $ref: '#/components/schemas/Header'
        params:
          type: array
          items:
            $ref: '#/components/schemas/Param'
        body:
          $ref: '#/components/schemas/RequestBody'
        auth:
          $ref: '#/components/schemas/Auth'
        preRequestScript:
          type: string
        testScript:
          type: string
        order:
          type: integer

    Environment:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        variables:
          type: array
          items:
            $ref: '#/components/schemas/Variable'
        global:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - variables
        - global
        - createdAt
        - updatedAt

    EnvironmentCreate:
      type: object
      properties:
        name:
          type: string
        variables:
          type: array
          items:
            $ref: '#/components/schemas/Variable'
        global:
          type: boolean
          default: false
      required:
        - name
        - variables

    EnvironmentUpdate:
      type: object
      properties:
        name:
          type: string
        variables:
          type: array
          items:
            $ref: '#/components/schemas/Variable'

    HistoryEntry:
      type: object
      properties:
        id:
          type: string
        method:
          type: string
        url:
          type: string
        statusCode:
          type: integer
        responseTime:
          type: integer
          description: Response time in milliseconds
        requestHeaders:
          type: array
          items:
            $ref: '#/components/schemas/Header'
        requestBody:
          type: string
          nullable: true
        responseHeaders:
          type: array
          items:
            $ref: '#/components/schemas/Header'
        responseBody:
          type: string
          nullable: true
        executedAt:
          type: string
          format: date-time
      required:
        - id
        - method
        - url
        - statusCode
        - responseTime
        - executedAt

    HistoryCreate:
      type: object
      properties:
        method:
          type: string
        url:
          type: string
        statusCode:
          type: integer
        responseTime:
          type: integer
        requestHeaders:
          type: array
          items:
            $ref: '#/components/schemas/Header'
        requestBody:
          type: string
          nullable: true
        responseHeaders:
          type: array
          items:
            $ref: '#/components/schemas/Header'
        responseBody:
          type: string
          nullable: true
      required:
        - method
        - url
        - statusCode
        - responseTime

    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
        - updatedAt

    TeamCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required:
        - name

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    TeamMember:
      type: object
      properties:
        userId:
          type: string
        role:
          type: string
          enum: [owner, editor, viewer]
      required:
        - userId
        - role

    Invitation:
      type: object
      properties:
        id:
          type: string
        teamId:
          type: string
        inviteeEmail:
          type: string
        inviteeUserId:
          type: string
        role:
          type: string
          enum: [editor, viewer]
        status:
          type: string
          enum: [pending, accepted]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - teamId
        - inviteeUserId
        - role
        - status
        - createdAt

    InvitationCreate:
      type: object
      properties:
        inviteeUserId:
          type: string
        role:
          type: string
          enum: [editor, viewer]
      required:
        - inviteeUserId
        - role

    ImportPostman:
      type: object
      properties:
        collectionJson:
          type: object
          description: Postman Collection v2.1 JSON object
        teamId:
          type: string
          nullable: true
          description: If provided, import into team workspace
      required:
        - collectionJson

    ExportResult:
      type: object
      properties:
        collection:
          type: object
          description: Collection data with nested collections and requests

    MoveRequest:
      type: object
      properties:
        collectionId:
          type: string
          description: Target collection ID
      required:
        - collectionId

    MoveCollection:
      type: object
      properties:
        parentId:
          type: string
          nullable: true
          description: Target parent collection ID (null for root)

paths:
  /collections:
    post:
      summary: Create a personal collection
      operationId: createCollection
      tags: [Collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreate'
      responses:
        '201':
          description: Collection created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List personal collections
      operationId: listCollections
      tags: [Collections]
      parameters:
        - name: parentId
          in: query
          schema:
            type: string
            nullable: true
          description: Filter by parent collection ID. Use "root" or omit for root-level collections.
      responses:
        '200':
          description: List of collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /collections/{id}:
    get:
      summary: Get collection details
      operationId: getCollection
      tags: [Collections]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Collection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update collection
      operationId: updateCollection
      tags: [Collections]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionUpdate'
      responses:
        '200':
          description: Collection updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete collection and all children
      operationId: deleteCollection
      tags: [Collections]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Collection deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /collections/{id}/duplicate:
    post:
      summary: Duplicate collection with all nested content
      operationId: duplicateCollection
      tags: [Collections]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Duplicated collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /collections/{id}/move:
    patch:
      summary: Move collection to a new parent
      operationId: moveCollection
      tags: [Collections]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCollection'
      responses:
        '200':
          description: Collection moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: Bad request (cycle detected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /collections/{id}/export:
    post:
      summary: Export collection as JSON
      operationId: exportCollection
      tags: [Import/Export]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Exported collection JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResult'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /requests:
    post:
      summary: Create a request in a collection
      operationId: createRequest
      tags: [Requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCreate'
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List requests
      operationId: listRequests
      tags: [Requests]
      parameters:
        - name: collectionId
          in: query
          schema:
            type: string
          description: Filter by collection ID
      responses:
        '200':
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /requests/{id}:
    get:
      summary: Get request details
      operationId: getRequest
      tags: [Requests]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update request
      operationId: updateRequest
      tags: [Requests]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUpdate'
      responses:
        '200':
          description: Request updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete request
      operationId: deleteRequest
      tags: [Requests]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Request deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /requests/{id}/duplicate:
    post:
      summary: Duplicate a request
      operationId: duplicateRequest
      tags: [Requests]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Duplicated request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /requests/{id}/move:
    patch:
      summary: Move request to another collection
      operationId: moveRequest
      tags: [Requests]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
      responses:
        '200':
          description: Request moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /environments:
    post:
      summary: Create an environment
      operationId: createEnvironment
      tags: [Environments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentCreate'
      responses:
        '201':
          description: Environment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict (duplicate global environment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List environments
      operationId: listEnvironments
      tags: [Environments]
      responses:
        '200':
          description: List of environments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Environment'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /environments/{id}:
    get:
      summary: Get environment details
      operationId: getEnvironment
      tags: [Environments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Environment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update environment
      operationId: updateEnvironment
      tags: [Environments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentUpdate'
      responses:
        '200':
          description: Environment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete environment
      operationId: deleteEnvironment
      tags: [Environments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Environment deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /history:
    post:
      summary: Record a history entry
      operationId: createHistory
      tags: [History]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryCreate'
      responses:
        '201':
          description: History entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryEntry'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List history entries
      operationId: listHistory
      tags: [History]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: List of history entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HistoryEntry'
                  total:
                    type: integer
                  page:
                    type: integer
                  perPage:
                    type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Clear all history
      operationId: clearHistory
      tags: [History]
      responses:
        '204':
          description: History cleared
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /history/{id}:
    get:
      summary: Get history entry details
      operationId: getHistory
      tags: [History]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
