  # ===================== GET INDIVIDUAL GOAL =====================
  /api/sites/{siteId}/goals/{goalId}:
    get:
      operationId: getGoal
      summary: Get a specific goal
      tags: [Goals]
      parameters:
        - $ref: '#/components/parameters/siteId'
        - name: goalId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Goal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '401':
          description: Unauthorized
        '404':
          description: Goal not found

    delete:
      operationId: deleteGoal
      summary: Delete a goal
      tags: [Goals]
      parameters:
        - $ref: '#/components/parameters/siteId'
        - name: goalId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Goal deleted
        '401':
          description: Unauthorized
        '404':
          description: Goal not found

  # ===================== BATCH EVENT INGESTION =====================
  /api/events:
    post:
      operationId: ingestEventsBatch
      summary: Record multiple events in a single request (public, no auth)
      tags: [Events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/Event'
              required: [events]
      responses:
        '202':
          description: Events accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  accepted:
                    type: integer
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===================== COMPARISON STATS =====================
  /api/sites/{siteId}/stats/compare:
    get:
      operationId: getComparisonStats
      summary: Compare current period stats to previous period
      tags: [Stats]
      parameters:
        - $ref: '#/components/parameters/siteId'
        - $ref: '#/components/parameters/period'
        - $ref: '#/components/parameters/date'
        - $ref: '#/components/parameters/dateFrom'
        - $ref: '#/components/parameters/dateTo'
        - $ref: '#/components/parameters/filters'
      responses:
        '200':
          description: Comparison stats with change percentages
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    $ref: '#/components/schemas/AggregateStats'
                  previous:
                    $ref: '#/components/schemas/AggregateStats'
                  change:
                    type: object
                    properties:
                      visitors:
                        type: number
                      pageviews:
                        type: number
                      bounceRate:
                        type: number
                      visitDuration:
                        type: number
                      visits:
                        type: number
        '401':
          description: Unauthorized
        '404':
          description: Site not found

  # ===================== SITE CURRENT VISITORS LIST =====================
  /api/sites/{siteId}/realtime/events:
    get:
      operationId: getRealtimeEvents
      summary: Get recent events (last 5 minutes)
      tags: [Realtime]
      parameters:
        - $ref: '#/components/parameters/siteId'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Recent events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    url:
                      type: string
                    country:
                      type: string
                    timestamp:
                      type: string
                      format: date-time
        '401':
          description: Unauthorized
        '404':
          description: Site not found

  # ===================== EXPORT =====================
  /api/sites/{siteId}/export:
    get:
      operationId: exportStats
      summary: Export stats as structured JSON
      tags: [Export]
      parameters:
        - $ref: '#/components/parameters/siteId'
        - $ref: '#/components/parameters/period'
        - $ref: '#/components/parameters/date'
        - $ref: '#/components/parameters/dateFrom'
        - $ref: '#/components/parameters/dateTo'
      responses:
        '200':
          description: Exported data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportData'
        '401':
          description: Unauthorized
        '404':
          description: Site not found
