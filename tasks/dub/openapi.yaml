openapi: 3.0.3
info:
  title: Dub - Link Management Platform API
  description: A modern link management platform with analytics, custom domains, and team collaboration.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local development server

security:
  - apiKey: []

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: "API key in format: {role}_{workspaceId}_{userId}"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message

    Link:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        slug:
          type: string
        url:
          type: string
          format: uri
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        folderId:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        password:
          type: string
          nullable: true
        ios:
          type: string
          nullable: true
        android:
          type: string
          nullable: true
        ogTitle:
          type: string
          nullable: true
        ogDescription:
          type: string
          nullable: true
        ogImage:
          type: string
          nullable: true
        archived:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userId:
          type: string
        clicks:
          type: integer
          default: 0

    CreateLinkRequest:
      type: object
      required:
        - url
      properties:
        domain:
          type: string
        slug:
          type: string
        url:
          type: string
          format: uri
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        folderId:
          type: string
        expiresAt:
          type: string
          format: date-time
        password:
          type: string
        ios:
          type: string
        android:
          type: string
        ogTitle:
          type: string
        ogDescription:
          type: string
        ogImage:
          type: string
        archived:
          type: boolean

    UpdateLinkRequest:
      type: object
      properties:
        domain:
          type: string
        slug:
          type: string
        url:
          type: string
          format: uri
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        folderId:
          type: string
        expiresAt:
          type: string
          format: date-time
        password:
          type: string
        ios:
          type: string
        android:
          type: string
        ogTitle:
          type: string
        ogDescription:
          type: string
        ogImage:
          type: string
        archived:
          type: boolean

    Domain:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        verified:
          type: boolean
          default: false
        primary:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time

    CreateDomainRequest:
      type: object
      required:
        - slug
      properties:
        slug:
          type: string
        primary:
          type: boolean

    UpdateDomainRequest:
      type: object
      properties:
        verified:
          type: boolean
        primary:
          type: boolean

    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateTagRequest:
      type: object
      required:
        - name
        - color
      properties:
        name:
          type: string
        color:
          type: string

    UpdateTagRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string

    Folder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parentId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateFolderRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        parentId:
          type: string

    UpdateFolderRequest:
      type: object
      properties:
        name:
          type: string
        parentId:
          type: string

    Workspace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        createdAt:
          type: string
          format: date-time

    UpdateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string

    Member:
      type: object
      properties:
        userId:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        email:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    InviteMemberRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, admin, member]

    UpdateMemberRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [owner, admin, member]

    ClickEvent:
      type: object
      properties:
        id:
          type: string
        linkId:
          type: string
        timestamp:
          type: string
          format: date-time
        country:
          type: string
        device:
          type: string
        browser:
          type: string
        os:
          type: string
        referer:
          type: string
        ip:
          type: string

    TimeseriesDataPoint:
      type: object
      properties:
        start:
          type: string
          format: date-time
        clicks:
          type: integer

    CountryAnalytics:
      type: object
      properties:
        country:
          type: string
        clicks:
          type: integer

    DeviceAnalytics:
      type: object
      properties:
        device:
          type: string
        clicks:
          type: integer

    BrowserAnalytics:
      type: object
      properties:
        browser:
          type: string
        clicks:
          type: integer

    OsAnalytics:
      type: object
      properties:
        os:
          type: string
        clicks:
          type: integer

    RefererAnalytics:
      type: object
      properties:
        referer:
          type: string
        clicks:
          type: integer

    BulkCreateLinksRequest:
      type: array
      items:
        $ref: '#/components/schemas/CreateLinkRequest'
      maxItems: 100

    BulkUpdateLinksRequest:
      type: object
      required:
        - linkIds
        - data
      properties:
        linkIds:
          type: array
          items:
            type: string
        data:
          $ref: '#/components/schemas/UpdateLinkRequest'

    BulkDeleteLinksRequest:
      type: object
      required:
        - linkIds
      properties:
        linkIds:
          type: array
          items:
            type: string

paths:
  /links:
    post:
      operationId: createLink
      summary: Create a link
      tags: [Links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      responses:
        '201':
          description: Link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      operationId: listLinks
      summary: List links
      tags: [Links]
      parameters:
        - name: domain
          in: query
          schema:
            type: string
        - name: tagId
          in: query
          schema:
            type: string
        - name: folderId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
          description: Search in slug, url, title, description
        - name: archived
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Link'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /links/count:
    get:
      operationId: getLinksCount
      summary: Get link count
      tags: [Links]
      parameters:
        - name: domain
          in: query
          schema:
            type: string
        - name: tagId
          in: query
          schema:
            type: string
        - name: folderId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: archived
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Link count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /links/info:
    get:
      operationId: getLinkInfo
      summary: Get link by domain and slug
      tags: [Links]
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
        - name: slug
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Link found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /links/{linkId}:
    get:
      operationId: getLink
      summary: Get a link
      tags: [Links]
      parameters:
        - name: linkId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Link details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      operationId: updateLink
      summary: Update a link
      tags: [Links]
      parameters:
        - name: linkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLinkRequest'
      responses:
        '200':
          description: Link updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slug conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: deleteLink
      summary: Delete a link
      tags: [Links]
      parameters:
        - name: linkId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Link deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /links/{linkId}/qr:
    get:
      operationId: getLinkQR
      summary: Get QR code for a link
      tags: [Links]
      parameters:
        - name: linkId
          in: path
          required: true
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: integer
            default: 256
        - name: format
          in: query
          schema:
            type: string
            enum: [svg, png]
            default: svg
      responses:
        '200':
          description: QR code image
          content:
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /links/bulk:
    post:
      operationId: bulkCreateLinks
      summary: Bulk create links
      tags: [Bulk Operations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateLinksRequest'
      responses:
        '201':
          description: Links created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Link'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slug conflict in batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      operationId: bulkUpdateLinks
      summary: Bulk update links
      tags: [Bulk Operations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateLinksRequest'
      responses:
        '200':
          description: Links updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Link'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: One or more links not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: bulkDeleteLinks
      summary: Bulk delete links
      tags: [Bulk Operations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteLinksRequest'
      responses:
        '200':
          description: Links deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedCount:
                    type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /r/{slug}:
    get:
      operationId: redirectLink
      summary: Redirect short link (default domain)
      tags: [Redirect]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: password
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to destination
          headers:
            Location:
              schema:
                type: string
        '401':
          description: Password required or incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Link expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /r/{domain}/{slug}:
    get:
      operationId: redirectLinkWithDomain
      summary: Redirect short link (custom domain)
      tags: [Redirect]
      security: []
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: password
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to destination
          headers:
            Location:
              schema:
                type: string
        '401':
          description: Password required or incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Link expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /analytics/timeseries:
    get:
      operationId: getAnalyticsTimeseries
      summary: Get clicks over time
      tags: [Analytics]
      parameters:
        - name: linkId
          in: query
          schema:
            type: string
        - name: domain
          in: query
          schema:
            type: string
        - name: tagId
          in: query
          schema:
            type: string
        - name: start
          in: query
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
        - name: interval
          in: query
          schema:
            type: string
            enum: [1h, 24h, 7d, 30d, 90d]
            default: 24h
      responses:
        '200':
          description: Timeseries data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeseriesDataPoint'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /analytics/countries:
    get:
      operationId: getAnalyticsCountries
      summary: Get clicks by country
      tags: [Analytics]
      parameters:
        - name: linkId
          in: query
          schema:
            type: string
        - name: domain
          in: query
          schema:
            type: string
        - name: tagId
          in: query
          schema:
            type: string
        - name: start
          in: query
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Country analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CountryAnalytics'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /analytics/devices:
    get:
      operationId: getAnalyticsDevices
      summary: Get clicks by device
      tags: [Analytics]
      parameters:
        - name: linkId
          in: query
          schema:
            type: string
        - name: domain
          in: query
          schema:
            type: string
        - name: tagId
          in: query
          schema:
            type: string
        - name: start
          in: query
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Device analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceAnalytics'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /analytics/browsers:
    get:
      operationId: getAnalyticsBrowsers
      summary: Get clicks by browser
      tags: [Analytics]
      parameters:
        - name: linkId
          in: query
          schema:
            type: string
        - name: domain
          in: query
          schema:
            type: string
        - name: tagId
          in: query
          schema:
            type: string
        - name: start
          in: query
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Browser analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrowserAnalytics'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /analytics/os:
    get:
      operationId: getAnalyticsOs
      summary: Get clicks by OS
      tags: [Analytics]
      parameters:
        - name: linkId
          in: query
          schema:
            type: string
        - name: domain
          in: query
          schema:
            type: string
        - name: tagId
          in: query
          schema:
            type: string
        - name: start
          in: query
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OS analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OsAnalytics'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /analytics/referers:
    get:
      operationId: getAnalyticsReferers
      summary: Get clicks by referer
      tags: [Analytics]
      parameters:
        - name: linkId
          in: query
          schema:
            type: string
        - name: domain
          in: query
          schema:
            type: string
        - name: tagId
          in: query
          schema:
            type: string
        - name: start
          in: query
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Referer analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefererAnalytics'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /events:
    get:
      operationId: getEvents
      summary: Get raw click events
      tags: [Events]
      parameters:
        - name: linkId
          in: query
          schema:
            type: string
        - name: domain
          in: query
          schema:
            type: string
        - name: start
          in: query
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Click events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClickEvent'
        '401':
          description: Unauthorized
