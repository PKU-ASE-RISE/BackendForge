        '204':
          description: View deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/bases/{baseId}/tables/{tableId}/views/{viewId}/records:
    parameters:
      - name: baseId
        in: path
        required: true
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        schema:
          type: string
      - name: viewId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List records through view (filtered and sorted)
      operationId: listViewRecords
      tags: [Views]
      responses:
        '200':
          description: Filtered/sorted records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordList'
        '401':
          description: Unauthorized

  /api/v1/bases/{baseId}/tables/{tableId}/views/{viewId}/filters:
    parameters:
      - name: baseId
        in: path
        required: true
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        schema:
          type: string
      - name: viewId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Create filter
      operationId: createFilter
      tags: [Filters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterCreate'
      responses:
        '201':
          description: Filter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    get:
      summary: List filters
      operationId: listFilters
      tags: [Filters]
      responses:
        '200':
          description: List of filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterList'
        '401':
          description: Unauthorized

  /api/v1/bases/{baseId}/tables/{tableId}/views/{viewId}/filters/{filterId}:
    parameters:
      - name: baseId
        in: path
        required: true
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        schema:
          type: string
      - name: viewId
        in: path
        required: true
        schema:
          type: string
      - name: filterId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get filter
      operationId: getFilter
      tags: [Filters]
      responses:
        '200':
          description: Filter details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    patch:
      summary: Update filter
      operationId: updateFilter
      tags: [Filters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterUpdate'
      responses:
        '200':
          description: Filter updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      summary: Delete filter
      operationId: deleteFilter
      tags: [Filters]
      responses:
        '204':
          description: Filter deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/bases/{baseId}/tables/{tableId}/views/{viewId}/sorts:
    parameters:
      - name: baseId
        in: path
        required: true
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        schema:
          type: string
      - name: viewId
        in: path
        required: true
        schema:
          type: string
