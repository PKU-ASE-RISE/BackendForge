openapi: 3.0.3
info:
  title: NocoDB API
  description: No-code database platform that turns databases into smart spreadsheets
  version: 1.0.0

servers:
  - url: http://localhost:8000

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    Base:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BaseCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string

    BaseUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string

    BaseList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Base'

    Table:
      type: object
      properties:
        id:
          type: string
        baseId:
          type: string
        title:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TableCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string

    TableUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string

    TableList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Table'

    Column:
      type: object
      properties:
        id:
          type: string
        tableId:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [text, number, email, url, date, checkbox, singleSelect, multiSelect, attachment, link, formula, lookup, rollup]
        options:
          type: object
        order:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ColumnCreate:
      type: object
      required: [title, type]
      properties:
        title:
          type: string
        type:
          type: string
          enum: [text, number, email, url, date, checkbox, singleSelect, multiSelect, attachment, link, formula, lookup, rollup]
        options:
          type: object

    ColumnUpdate:
      type: object
      properties:
        title:
          type: string
        options:
          type: object

    ColumnList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Column'

    Record:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string

    RecordCreate:
      type: object
      additionalProperties: true

    RecordUpdate:
      type: object
      additionalProperties: true

    RecordList:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/Record'

    View:
      type: object
      properties:
        id:
          type: string
        tableId:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [grid, form, gallery, kanban]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ViewCreate:
      type: object
      required: [title, type]
      properties:
        title:
          type: string
        type:
          type: string
          enum: [grid, form, gallery, kanban]

    ViewUpdate:
      type: object
      properties:
        title:
          type: string

    ViewList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/View'

    Filter:
      type: object
      properties:
        id:
          type: string
        viewId:
          type: string
        columnId:
          type: string
        operator:
          type: string
          enum: [eq, neq, gt, lt, gte, lte, contains, notContains, is_null, is_not_null]
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: "null"

    FilterCreate:
      type: object
      required: [columnId, operator]
      properties:
        columnId:
          type: string
        operator:
          type: string
          enum: [eq, neq, gt, lt, gte, lte, contains, notContains, is_null, is_not_null]
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: "null"

    FilterUpdate:
      type: object
      properties:
        operator:
          type: string
          enum: [eq, neq, gt, lt, gte, lte, contains, notContains, is_null, is_not_null]
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: "null"

    FilterList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Filter'

    Sort:
      type: object
      properties:
        id:
          type: string
        viewId:
          type: string
        columnId:
          type: string
        direction:
          type: string
          enum: [asc, desc]

    SortCreate:
      type: object
      required: [columnId, direction]
      properties:
        columnId:
          type: string
        direction:
          type: string
          enum: [asc, desc]

    SortUpdate:
      type: object
      properties:
        direction:
          type: string
          enum: [asc, desc]

    SortList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sort'

    Share:
      type: object
      properties:
        id:
          type: string
        viewId:
          type: string
        uuid:
          type: string
        password:
          type: string
        createdAt:
          type: string
          format: date-time

    ShareCreate:
      type: object
      properties:
        password:
          type: string

    ShareList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Share'

    Hook:
      type: object
      properties:
        id:
          type: string
        tableId:
          type: string
        title:
          type: string
        event:
          type: string
          enum: [record.created, record.updated, record.deleted]
        url:
          type: string
          format: uri
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HookCreate:
      type: object
      required: [title, event, url]
      properties:
        title:
          type: string
        event:
          type: string
          enum: [record.created, record.updated, record.deleted]
        url:
          type: string
          format: uri
        enabled:
          type: boolean
          default: true

    HookUpdate:
      type: object
      properties:
        title:
          type: string
        event:
          type: string
          enum: [record.created, record.updated, record.deleted]
        url:
          type: string
          format: uri
        enabled:
          type: boolean

    HookList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Hook'

    Comment:
      type: object
      properties:
        id:
          type: string
        recordId:
          type: string
        userId:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    CommentCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string

    CommentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'

    AuditEntry:
      type: object
      properties:
        id:
          type: string
        baseId:
          type: string
        tableId:
          type: string
        recordId:
          type: string
        userId:
          type: string
        action:
          type: string
          enum: [created, updated, deleted]
        timestamp:
          type: string
          format: date-time
        changes:
          type: object

    AuditList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'

paths:
  /api/v1/bases:
    post:
      summary: Create a base
      operationId: createBase
      tags: [Bases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseCreate'
      responses:
        '201':
          description: Base created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Base'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List bases
      operationId: listBases
      tags: [Bases]
      responses:
        '200':
          description: List of bases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseList'
        '401':
          description: Unauthorized

  /api/v1/bases/{baseId}:
    parameters:
      - name: baseId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get base details
      operationId: getBase
      tags: [Bases]
      responses:
        '200':
          description: Base details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Base'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    patch:
      summary: Update base
      operationId: updateBase
      tags: [Bases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseUpdate'
      responses:
        '200':
          description: Base updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Base'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      summary: Delete base
      operationId: deleteBase
      tags: [Bases]
      responses:
        '204':
          description: Base deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/bases/{baseId}/audit:
    parameters:
      - name: baseId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get audit log
      operationId: getAuditLog
      tags: [Bases]
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/v1/bases/{baseId}/tables:
    parameters:
      - name: baseId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Create table
      operationId: createTable
      tags: [Tables]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableCreate'
      responses:
        '201':
          description: Table created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    get:
      summary: List tables
      operationId: listTables
      tags: [Tables]
      responses:
        '200':
          description: List of tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableList'
        '401':
          description: Unauthorized

  /api/v1/bases/{baseId}/tables/{tableId}:
    parameters:
      - name: baseId
        in: path
        required: true
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get table with columns
      operationId: getTable
      tags: [Tables]
      responses:
        '200':
          description: Table details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    patch:
      summary: Update table
      operationId: updateTable
      tags: [Tables]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableUpdate'
      responses:
        '200':
          description: Table updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      summary: Delete table
      operationId: deleteTable
      tags: [Tables]
      responses:
        '204':
          description: Table deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/bases/{baseId}/tables/{tableId}/columns:
    parameters:
      - name: baseId
        in: path
        required: true
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Create column
      operationId: createColumn
      tags: [Columns]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnCreate'
      responses:
        '201':
          description: Column created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '400':
          description: Bad request
    get:
      summary: List columns
      operationId: listColumns
      tags: [Columns]
      responses:
        '200':
          description: List of columns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnList'
        '401':
          description: Unauthorized

  /api/v1/bases/{baseId}/tables/{tableId}/columns/{columnId}:
    parameters:
      - name: baseId
        in: path
        required: true
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        schema:
          type: string
      - name: columnId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get column
      operationId: getColumn
      tags: [Columns]
      responses:
        '200':
          description: Column details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    patch:
      summary: Update column
      operationId: updateColumn
      tags: [Columns]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnUpdate'
      responses:
        '200':
          description: Column updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      summary: Delete column
      operationId: deleteColumn
      tags: [Columns]
      responses:
        '204':
          description: Column deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/bases/{baseId}/tables/{tableId}/records:
    parameters:
      - name: baseId
        in: path
        required: true
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Create record
      operationId: createRecord
      tags: [Records]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCreate'
      responses:
        '201':
          description: Record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '400':
          description: Validation error
    get:
      summary: List records
      operationId: listRecords
      tags: [Records]
      responses:
        '200':
          description: List of records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordList'
        '401':
          description: Unauthorized

  /api/v1/bases/{baseId}/tables/{tableId}/records/{recordId}:
    parameters:
      - name: baseId
        in: path
        required: true
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        schema:
          type: string
      - name: recordId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get record
      operationId: getRecord
      tags: [Records]
      responses:
        '200':
          description: Record details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    patch:
      summary: Update record
      operationId: updateRecord
      tags: [Records]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordUpdate'
      responses:
        '200':
          description: Record updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      summary: Delete record
      operationId: deleteRecord
      tags: [Records]
      responses:
        '204':
          description: Record deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/bases/{baseId}/tables/{tableId}/views:
    parameters:
      - name: baseId
        in: path
        required: true
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Create view
      operationId: createView
      tags: [Views]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewCreate'
      responses:
        '201':
          description: View created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    get:
      summary: List views
      operationId: listViews
      tags: [Views]
      responses:
        '200':
          description: List of views
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewList'
        '401':
          description: Unauthorized

  /api/v1/bases/{baseId}/tables/{tableId}/views/{viewId}:
    parameters:
      - name: baseId
        in: path
        required: true
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        schema:
          type: string
      - name: viewId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get view
      operationId: getView
      tags: [Views]
      responses:
        '200':
          description: View details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    patch:
      summary: Update view
      operationId: updateView
      tags: [Views]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewUpdate'
      responses:
        '200':
          description: View updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      summary: Delete view
      operationId: deleteView
      tags: [Views]
