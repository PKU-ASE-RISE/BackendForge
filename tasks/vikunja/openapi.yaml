openapi: 3.0.3
info:
  title: Vikunja REST-API
  description: Self-hosted task/project management application
  version: "1.0.0"

servers:
  - url: http://localhost:8000

security:
  - UserIdAuth: []

components:
  securitySchemes:
    UserIdAuth:
      type: apiKey
      in: header
      name: X-User-Id

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    Project:
      type: object
      required:
        - id
        - title
        - owner_id
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
        description:
          type: string
          default: ""
        color:
          type: string
          default: ""
        is_archived:
          type: boolean
          default: false
        position:
          type: number
          format: float
          default: 0
        parent_project_id:
          type: integer
          format: int64
          nullable: true
        owner_id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    ProjectCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
          default: ""
        color:
          type: string
          default: ""
        is_archived:
          type: boolean
          default: false
        position:
          type: number
          format: float
          default: 0
        parent_project_id:
          type: integer
          format: int64
          nullable: true

    Task:
      type: object
      required:
        - id
        - title
        - project_id
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
        description:
          type: string
          default: ""
        done:
          type: boolean
          default: false
        priority:
          type: integer
          minimum: 0
          maximum: 5
          default: 0
        due_date:
          type: string
          format: date-time
          nullable: true
        start_date:
          type: string
          format: date-time
          nullable: true
        end_date:
          type: string
          format: date-time
          nullable: true
        percent_done:
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 0
        position:
          type: number
          format: float
          default: 0
        project_id:
          type: integer
          format: int64
        bucket_id:
          type: integer
          format: int64
          nullable: true
        created_by_id:
          type: string
          readOnly: true
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/UserInfo'
          default: []
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
          default: []
        reminders:
          type: array
          items:
            type: string
            format: date-time
          default: []
        relations:
          type: object
          additionalProperties:
            type: array
            items:
              type: integer
              format: int64
          default: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    TaskCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
          default: ""
        done:
          type: boolean
          default: false
        priority:
          type: integer
          minimum: 0
          maximum: 5
          default: 0
        due_date:
          type: string
          format: date-time
          nullable: true
        start_date:
          type: string
          format: date-time
          nullable: true
        end_date:
          type: string
          format: date-time
          nullable: true
        percent_done:
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 0
        position:
          type: number
          format: float
          default: 0
        reminders:
          type: array
          items:
            type: string
            format: date-time
          default: []

    Label:
      type: object
      required:
        - id
        - title
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
        color:
          type: string
          default: ""
        description:
          type: string
          default: ""
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    LabelCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        color:
          type: string
          default: ""
        description:
          type: string
          default: ""

    Comment:
      type: object
      required:
        - id
        - comment
        - author_id
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        comment:
          type: string
        author_id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    CommentCreate:
      type: object
      required:
        - comment
      properties:
        comment:
          type: string

    Relation:
      type: object
      required:
        - task_id
        - other_task_id
        - relation_kind
      properties:
        task_id:
          type: integer
          format: int64
        other_task_id:
          type: integer
          format: int64
        relation_kind:
          type: string
          enum:
            - related
            - duplicates
            - duplicated_by
            - blocks
            - blocked_by
            - subtask_of
            - parent_of

    RelationCreate:
      type: object
      required:
        - other_task_id
        - relation_kind
      properties:
        other_task_id:
          type: integer
          format: int64
        relation_kind:
          type: string
          enum:
            - related
            - duplicates
            - duplicated_by
            - blocks
            - blocked_by
            - subtask_of
            - parent_of

    ProjectMember:
      type: object
      required:
        - user_id
        - role
      properties:
        user_id:
          type: string
        role:
          type: string
          enum:
            - owner
            - editor
            - viewer

    ProjectMemberCreate:
      type: object
      required:
        - user_id
        - role
      properties:
        user_id:
          type: string
        role:
          type: string
          enum:
            - editor
            - viewer

    ProjectMemberUpdate:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - editor
            - viewer

    Bucket:
      type: object
      required:
        - id
        - title
        - project_id
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
        position:
          type: number
          format: float
          default: 0
        limit:
          type: integer
          default: 0
          description: Max number of tasks. 0 = unlimited.
        project_id:
          type: integer
          format: int64
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    BucketCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        position:
          type: number
          format: float
          default: 0
        limit:
          type: integer
          default: 0

    Filter:
      type: object
      required:
        - id
        - title
        - filter_query
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
        filter_query:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    FilterCreate:
      type: object
      required:
        - title
        - filter_query
      properties:
        title:
          type: string
        filter_query:
          type: string

    UserInfo:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string
        username:
          type: string

    TaskBucketUpdate:
      type: object
      required:
        - bucket_id
      properties:
        bucket_id:
          type: integer
          format: int64

    TaskLabelCreate:
      type: object
      required:
        - label_id
      properties:
        label_id:
          type: integer
          format: int64

    TaskAssigneeCreate:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string

paths:
  # ─── Projects ───
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List all projects accessible to the current user
      responses:
        "200":
          description: Array of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createProject
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        "201":
          description: The created project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/projects/{id}:
    get:
      operationId: getProject
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateProject
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteProject
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Project deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Tasks ───
  /api/v1/projects/{id}/tasks:
    get:
      operationId: listProjectTasks
      summary: List tasks in a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [position, priority, due_date, created_at]
            default: position
        - name: order_by
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: filter_done
          in: query
          required: false
          schema:
            type: boolean
            description: "If provided, filter tasks by done status"
        - name: filter_priority
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 5
            description: "If provided, filter tasks with priority >= this value"
      responses:
        "200":
          description: Array of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createTask
      summary: Create a task in a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        "201":
          description: The created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      summary: Get a task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The task with all metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateTask
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        "200":
          description: The updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteTask
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Task deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Labels ───
  /api/v1/labels:
    get:
      operationId: listLabels
      summary: List all labels for the current user
      responses:
        "200":
          description: Array of labels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Label'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createLabel
      summary: Create a label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelCreate'
      responses:
        "201":
          description: The created label
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/labels/{id}:
    get:
      operationId: getLabel
      summary: Get a label by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The label
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateLabel
      summary: Update a label
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelCreate'
      responses:
        "200":
          description: The updated label
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteLabel
      summary: Delete a label
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Label deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Task Labels ───
  /api/v1/tasks/{id}/labels:
    post:
      operationId: addTaskLabel
      summary: Attach a label to a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskLabelCreate'
      responses:
        "201":
          description: Label attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/tasks/{id}/labels/{labelId}:
    delete:
      operationId: removeTaskLabel
      summary: Detach a label from a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: labelId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Label detached
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Task Assignees ───
  /api/v1/tasks/{id}/assignees:
    post:
      operationId: addTaskAssignee
      summary: Assign a user to a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAssigneeCreate'
      responses:
        "201":
          description: User assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/tasks/{id}/assignees/{userId}:
    delete:
      operationId: removeTaskAssignee
      summary: Unassign a user from a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: User unassigned
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
