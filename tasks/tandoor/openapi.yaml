openapi: 3.0.3
info:
  title: Tandoor Recipes API
  description: Recipe management with meal planning and shopping lists
  version: "1.0.0"

servers:
  - url: http://localhost:8000

security:
  - UserAuth: []

components:
  securitySchemes:
    UserAuth:
      type: apiKey
      in: header
      name: X-User-Id

  schemas:
    Error:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string

    Keyword:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        description:
          type: string
          default: ""
        parent_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    KeywordCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          default: ""
        parent_id:
          type: integer
          nullable: true

    Food:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        description:
          type: string
          default: ""
        recipe_id:
          type: integer
          nullable: true
        supermarket_category_id:
          type: integer
          nullable: true
        calories_per_unit:
          type: number
          nullable: true
        protein_per_unit:
          type: number
          nullable: true
        fat_per_unit:
          type: number
          nullable: true
        carbs_per_unit:
          type: number
          nullable: true

    FoodCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          default: ""
        recipe_id:
          type: integer
          nullable: true
        supermarket_category_id:
          type: integer
          nullable: true
        calories_per_unit:
          type: number
          nullable: true
        protein_per_unit:
          type: number
          nullable: true
        fat_per_unit:
          type: number
          nullable: true
        carbs_per_unit:
          type: number
          nullable: true

    Unit:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        plural_name:
          type: string
          default: ""
        description:
          type: string
          default: ""

    UnitCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        plural_name:
          type: string
          default: ""
        description:
          type: string
          default: ""

    Ingredient:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          readOnly: true
        food_id:
          type: integer
          nullable: true
        unit_id:
          type: integer
          nullable: true
        amount:
          type: number
          default: 0
        note:
          type: string
          default: ""
        is_header:
          type: boolean
          default: false
        no_amount:
          type: boolean
          default: false
        order:
          type: integer
          default: 0

    IngredientCreate:
      type: object
      properties:
        food_id:
          type: integer
          nullable: true
        unit_id:
          type: integer
          nullable: true
        amount:
          type: number
          default: 0
        note:
          type: string
          default: ""
        is_header:
          type: boolean
          default: false
        no_amount:
          type: boolean
          default: false
        order:
          type: integer
          default: 0

    Step:
      type: object
      required:
        - id
        - order
      properties:
        id:
          type: integer
          readOnly: true
        instruction:
          type: string
          default: ""
        time:
          type: integer
          default: 0
          description: Time in minutes for this step
        order:
          type: integer
        step_type:
          type: string
          enum: [text, file]
          default: text
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'

    StepCreate:
      type: object
      required:
        - order
      properties:
        instruction:
          type: string
          default: ""
        time:
          type: integer
          default: 0
        order:
          type: integer
        step_type:
          type: string
          enum: [text, file]
          default: text
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/IngredientCreate'
          default: []

    Recipe:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        description:
          type: string
          default: ""
        servings:
          type: integer
          default: 1
        working_time:
          type: integer
          default: 0
          description: Working time in minutes
        waiting_time:
          type: integer
          default: 0
          description: Waiting time in minutes
        source_url:
          type: string
          default: ""
        internal:
          type: boolean
          default: false
        keywords:
          type: array
          items:
            $ref: '#/components/schemas/Keyword'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'
        created_at:
          type: string
          format: date-time
          readOnly: true

    RecipeCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          default: ""
        servings:
          type: integer
          default: 1
        working_time:
          type: integer
          default: 0
        waiting_time:
          type: integer
          default: 0
        source_url:
          type: string
          default: ""
        internal:
          type: boolean
          default: false
        keyword_ids:
          type: array
          items:
            type: integer
          default: []
        steps:
          type: array
          items:
            $ref: '#/components/schemas/StepCreate'
          default: []

    RecipeList:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        servings:
          type: integer
        working_time:
          type: integer
        waiting_time:
          type: integer
        keywords:
          type: array
          items:
            $ref: '#/components/schemas/Keyword'
        created_at:
          type: string
          format: date-time

    Nutrition:
      type: object
      required:
        - recipe_id
        - servings
        - calories
        - protein
        - fat
        - carbs
      properties:
        recipe_id:
          type: integer
        servings:
          type: integer
        calories:
          type: number
        protein:
          type: number
        fat:
          type: number
        carbs:
          type: number

    MealPlan:
      type: object
      required:
        - id
        - date
        - meal_type
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        meal_type:
          type: string
          enum: [breakfast, lunch, dinner, other]
        recipe_id:
          type: integer
          nullable: true
        servings:
          type: number
          default: 1
        title:
          type: string
          default: ""
        note:
          type: string
          default: ""

    MealPlanCreate:
      type: object
      required:
        - date
        - meal_type
      properties:
        date:
          type: string
          format: date
        meal_type:
          type: string
          enum: [breakfast, lunch, dinner, other]
        recipe_id:
          type: integer
          nullable: true
        servings:
          type: number
          default: 1
        title:
          type: string
          default: ""
        note:
          type: string
          default: ""

    ShoppingList:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        supermarket_id:
          type: integer
          nullable: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingListEntry'
        created_at:
          type: string
          format: date-time
          readOnly: true

    ShoppingListCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        supermarket_id:
          type: integer
          nullable: true

    ShoppingListEntry:
      type: object
      required:
        - id
        - food_id
      properties:
        id:
          type: integer
          readOnly: true
        food_id:
          type: integer
        unit_id:
          type: integer
          nullable: true
        amount:
          type: number
          default: 0
        checked:
          type: boolean
          default: false

    ShoppingListEntryCreate:
      type: object
      required:
        - food_id
      properties:
        food_id:
          type: integer
        unit_id:
          type: integer
          nullable: true
        amount:
          type: number
          default: 0
        checked:
          type: boolean
          default: false

    ShoppingListEntryUpdate:
      type: object
      properties:
        food_id:
          type: integer
        unit_id:
          type: integer
          nullable: true
        amount:
          type: number
        checked:
          type: boolean

    AddRecipeToList:
      type: object
      required:
        - recipe_id
      properties:
        recipe_id:
          type: integer
        servings:
          type: number
          description: Desired servings (defaults to recipe servings if omitted)

    Supermarket:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        description:
          type: string
          default: ""
        category_ordering:
          type: array
          items:
            type: integer
          description: Ordered list of supermarket_category IDs
          default: []

    SupermarketCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          default: ""
        category_ordering:
          type: array
          items:
            type: integer
          default: []

    SupermarketCategory:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        description:
          type: string
          default: ""

    SupermarketCategoryCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          default: ""

    ImportUrl:
      type: object
      required:
        - url
      properties:
        url:
          type: string

    RecipeExport:
      type: object
      required:
        - version
        - exported_at
        - recipe
      properties:
        version:
          type: string
        exported_at:
          type: string
          format: date-time
        recipe:
          $ref: '#/components/schemas/Recipe'

paths:
  /api/keywords:
    get:
      operationId: listKeywords
      summary: List keywords
      parameters:
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
        - name: parent_id
          in: query
          schema:
            type: integer
          description: Filter by parent keyword ID
        - name: root_only
          in: query
          schema:
            type: boolean
          description: If true, only return keywords with no parent
      responses:
        "200":
          description: List of keywords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Keyword'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createKeyword
      summary: Create a keyword
      parameters:
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeywordCreate'
      responses:
        "201":
          description: Created keyword
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Keyword'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/keywords/{id}:
    get:
      operationId: getKeyword
      summary: Get a keyword by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The keyword
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Keyword'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateKeyword
      summary: Update a keyword
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeywordCreate'
      responses:
        "200":
          description: Updated keyword
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Keyword'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteKeyword
      summary: Delete a keyword and its descendants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/foods:
    get:
      operationId: listFoods
      summary: List foods
      parameters:
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of foods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Food'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createFood
      summary: Create a food
      parameters:
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodCreate'
      responses:
        "201":
          description: Created food
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/foods/{id}:
    get:
      operationId: getFood
      summary: Get a food by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The food
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateFood
      summary: Update a food
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodCreate'
      responses:
        "200":
          description: Updated food
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteFood
      summary: Delete a food
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/units:
    get:
      operationId: listUnits
      summary: List units
      parameters:
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Unit'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createUnit
      summary: Create a unit
      parameters:
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitCreate'
      responses:
        "201":
          description: Created unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/units/{id}:
    get:
      operationId: getUnit
      summary: Get a unit by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateUnit
      summary: Update a unit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitCreate'
      responses:
        "200":
          description: Updated unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteUnit
      summary: Delete a unit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/recipes:
    get:
      operationId: listRecipes
      summary: List recipes
      parameters:
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
          description: Search in recipe name
        - name: keywords
          in: query
          schema:
            type: string
          description: Comma-separated keyword IDs. Also matches descendant keywords.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated recipe list
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                  - results
                properties:
                  count:
                    type: integer
                    description: Total number of matching recipes
                  page:
                    type: integer
                  page_size:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecipeList'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createRecipe
      summary: Create a recipe
      parameters:
        - name: X-Space-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeCreate'
      responses:
        "201":
          description: Created recipe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
