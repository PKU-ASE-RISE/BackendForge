              type: object
              required: [shippingMethodId]
              properties:
                shippingMethodId:
                  type: string
      responses:
        '200':
          description: Shipping method selected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
        '400':
          description: Invalid shipping method for this address
        '404':
          description: Not found

  /checkouts/{id}/voucher:
    post:
      summary: Apply voucher to checkout
      tags: [Checkout]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Voucher applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
        '400':
          description: Invalid voucher
        '404':
          description: Not found
    delete:
      summary: Remove voucher from checkout
      tags: [Checkout]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Voucher removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
        '404':
          description: Not found

  /checkouts/{id}/complete:
    post:
      summary: Complete checkout (creates order)
      tags: [Checkout]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Checkout incomplete or payment failed
        '404':
          description: Not found

  /orders:
    get:
      summary: List orders
      tags: [Orders]
      parameters:
        - name: channel
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  totalCount:
                    type: integer

  /orders/{id}:
    get:
      summary: Get order by ID
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Not found

  /orders/{id}/fulfillments:
    post:
      summary: Create a fulfillment
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, lines]
              properties:
                warehouseId:
                  type: string
                lines:
                  type: array
                  items:
                    type: object
                    required: [orderLineId, quantity]
                    properties:
                      orderLineId:
                        type: string
                      quantity:
                        type: integer
                trackingNumber:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Fulfillment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fulfillment'
        '400':
          description: Invalid fulfillment
        '403':
          description: Forbidden
        '404':
          description: Order not found

  /orders/{id}/return:
    post:
      summary: Return order lines (triggers refund)
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  items:
                    type: object
                    required: [orderLineId, quantity]
                    properties:
                      orderLineId:
                        type: string
                      quantity:
                        type: integer
      responses:
        '200':
          description: Return processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid return
        '403':
          description: Forbidden
        '404':
          description: Order not found
