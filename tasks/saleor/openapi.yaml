openapi: 3.0.3
info:
  title: Saleor Commerce API
  description: Headless e-commerce platform with multi-channel, multi-warehouse support
  version: 1.0.0

servers:
  - url: http://localhost:8000

security:
  - apiKey: []

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    Channel:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        currencyCode:
          type: string
        isActive:
          type: boolean

    Warehouse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        shippingZones:
          type: array
          items:
            type: string

    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string

    ProductType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        productAttributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinition'
        variantAttributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinition'
        taxClassId:
          type: string
          nullable: true
        isDigital:
          type: boolean

    AttributeDefinition:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [text, numeric, boolean, select]
        choices:
          type: array
          items:
            type: string
          nullable: true

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        parentId:
          type: string
          nullable: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        productTypeId:
          type: string
        categoryId:
          type: string
          nullable: true
        attributes:
          type: object
        channelListings:
          type: array
          items:
            $ref: '#/components/schemas/ProductChannelListing'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'

    ProductChannelListing:
      type: object
      properties:
        channelSlug:
          type: string
        isPublished:
          type: boolean
        visibleInListings:
          type: boolean

    ProductVariant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        attributes:
          type: object
        weight:
          type: number
          nullable: true
        channelListings:
          type: array
          items:
            $ref: '#/components/schemas/VariantChannelListing'
        stocks:
          type: array
          items:
            $ref: '#/components/schemas/Stock'

    VariantChannelListing:
      type: object
      properties:
        channelSlug:
          type: string
        price:
          type: number
        costPrice:
          type: number
          nullable: true
        currencyCode:
          type: string

    Stock:
      type: object
      properties:
        warehouseId:
          type: string
        quantity:
          type: integer
        allocatedQuantity:
          type: integer

    Collection:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        channelListings:
          type: array
          items:
            $ref: '#/components/schemas/CollectionChannelListing'
        products:
          type: array
          items:
            type: string

    CollectionChannelListing:
      type: object
      properties:
        channelSlug:
          type: string
        isPublished:
          type: boolean

    ShippingZone:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        countries:
          type: array
          items:
            type: string
        warehouses:
          type: array
          items:
            type: string
        methods:
          type: array
          items:
            $ref: '#/components/schemas/ShippingMethod'

    ShippingMethod:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [price, weight]
        minValue:
          type: number
          nullable: true
        maxValue:
          type: number
          nullable: true
        rate:
          type: number
        currencyCode:
          type: string

    TaxClass:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        rates:
          type: array
          items:
            $ref: '#/components/schemas/TaxRate'

    TaxRate:
      type: object
      properties:
        countryCode:
          type: string
        rate:
          type: number

    Voucher:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        type:
          type: string
          enum: [percentage, fixed, freeShipping]
        value:
          type: number
        channelSlug:
          type: string
          nullable: true
        minOrderValue:
          type: number
          nullable: true
        usageLimit:
          type: integer
          nullable: true
        usedCount:
          type: integer
        products:
          type: array
          items:
            type: string
          nullable: true
        categories:
          type: array
          items:
            type: string
          nullable: true
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true

    Customer:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/CustomerAddress'
        note:
          type: string

    CustomerAddress:
      type: object
      properties:
        id:
          type: string
        street:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        isDefaultShipping:
          type: boolean
        isDefaultBilling:
          type: boolean

    Checkout:
      type: object
      properties:
        id:
          type: string
        channelSlug:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutLine'
        shippingAddress:
          $ref: '#/components/schemas/Address'
        billingAddress:
          $ref: '#/components/schemas/Address'
        shippingMethodId:
          type: string
          nullable: true
        voucherCode:
          type: string
          nullable: true
        customerEmail:
          type: string
        subtotal:
          type: number
        shippingPrice:
          type: number
        taxTotal:
          type: number
        discount:
          type: number
        total:
          type: number

    CheckoutLine:
      type: object
      properties:
        id:
          type: string
        variantId:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        totalPrice:
          type: number

    Order:
      type: object
      properties:
        id:
          type: string
        channelSlug:
          type: string
        status:
          type: string
          enum: [unfulfilled, partiallyFulfilled, fulfilled, returned]
        paymentStatus:
          type: string
          enum: [authorized, captured, refunded, partiallyRefunded]
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        shippingAddress:
          $ref: '#/components/schemas/Address'
        billingAddress:
          $ref: '#/components/schemas/Address'
        shippingMethodId:
          type: string
        shippingPrice:
          type: number
        subtotal:
          type: number
        taxTotal:
          type: number
        discount:
          type: number
        total:
          type: number
        customerEmail:
          type: string
        fulfillments:
          type: array
          items:
            $ref: '#/components/schemas/Fulfillment'
        paymentId:
          type: string
        voucherCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    OrderLine:
      type: object
      properties:
        id:
          type: string
        variantId:
          type: string
        productName:
          type: string
        variantName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        totalPrice:
          type: number
        taxRate:
          type: number
        taxAmount:
          type: number
        fulfilledQuantity:
          type: integer

    Fulfillment:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        trackingNumber:
          type: string
          nullable: true
        warehouseId:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentLine'
        createdAt:
          type: string
          format: date-time

    FulfillmentLine:
      type: object
      properties:
        orderLineId:
          type: string
        quantity:
          type: integer

paths:
  /channels:
    post:
      summary: Create a channel
      tags: [Channels]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, currencyCode]
              properties:
                slug:
                  type: string
                name:
                  type: string
                currencyCode:
                  type: string
                isActive:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Channel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
    get:
      summary: List all channels
      tags: [Channels]
      responses:
        '200':
          description: List of channels
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
                  totalCount:
                    type: integer

  /channels/{slug}:
    get:
      summary: Get channel by slug
      tags: [Channels]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '404':
          description: Not found
    put:
      summary: Update a channel
      tags: [Channels]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                isActive:
                  type: boolean
      responses:
        '200':
          description: Channel updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      summary: Delete a channel
      tags: [Channels]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Channel deleted
        '403':
          description: Forbidden
        '404':
          description: Not found

  /warehouses:
    post:
      summary: Create a warehouse
      tags: [Warehouses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, address]
              properties:
                name:
                  type: string
                slug:
                  type: string
                address:
                  $ref: '#/components/schemas/Address'
                shippingZones:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Warehouse created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '403':
          description: Forbidden
    get:
      summary: List warehouses
      tags: [Warehouses]
      responses:
        '200':
          description: List of warehouses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Warehouse'
                  totalCount:
                    type: integer

  /warehouses/{id}:
    get:
      summary: Get warehouse by ID
      tags: [Warehouses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Warehouse details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '404':
          description: Not found
    put:
      summary: Update a warehouse
      tags: [Warehouses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  $ref: '#/components/schemas/Address'
                shippingZones:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Warehouse updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      summary: Delete a warehouse
      tags: [Warehouses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Warehouse deleted
        '403':
          description: Forbidden
        '404':
          description: Not found

  /product-types:
    post:
      summary: Create a product type
      tags: [Product Types]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                slug:
                  type: string
                productAttributes:
                  type: array
                  items:
                    $ref: '#/components/schemas/AttributeDefinition'
                variantAttributes:
                  type: array
                  items:
                    $ref: '#/components/schemas/AttributeDefinition'
                taxClassId:
                  type: string
                  nullable: true
                isDigital:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Product type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductType'
        '403':
          description: Forbidden
    get:
      summary: List product types
      tags: [Product Types]
      responses:
        '200':
          description: List of product types
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductType'
                  totalCount:
                    type: integer

  /product-types/{id}:
    get:
      summary: Get product type by ID
      tags: [Product Types]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product type details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductType'
        '404':
          description: Not found
    put:
      summary: Update a product type
      tags: [Product Types]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                productAttributes:
                  type: array
                  items:
                    $ref: '#/components/schemas/AttributeDefinition'
                variantAttributes:
                  type: array
                  items:
                    $ref: '#/components/schemas/AttributeDefinition'
                taxClassId:
                  type: string
                  nullable: true
                isDigital:
                  type: boolean
      responses:
        '200':
          description: Product type updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductType'
        '403':
          description: Forbidden
        '404':
          description: Not found

  /categories:
    post:
      summary: Create a category
      tags: [Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                parentId:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          description: Forbidden
    get:
      summary: List categories
      tags: [Categories]
      parameters:
        - name: parent
          in: query
          schema:
            type: string
          description: Filter by parent category ID (use "root" for top-level)
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  totalCount:
                    type: integer

  /categories/{id}:
    get:
      summary: Get category by ID
      tags: [Categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Not found
    put:
      summary: Update a category
      tags: [Categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                parentId:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      summary: Delete a category
      tags: [Categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Category deleted
        '403':
          description: Forbidden
        '404':
          description: Not found

  /products:
    post:
      summary: Create a product
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, productTypeId]
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                productTypeId:
                  type: string
                categoryId:
                  type: string
                  nullable: true
                attributes:
                  type: object
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '403':
          description: Forbidden
    get:
      summary: List products (channel-scoped)
      tags: [Products]
      parameters:
        - name: channel
          in: query
          required: true
          schema:
            type: string
          description: Channel slug to scope product visibility
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category ID
        - name: collection
          in: query
          schema:
            type: string
          description: Filter by collection ID
      responses:
        '200':
          description: List of products visible in the channel
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  totalCount:
                    type: integer

  /products/{id}:
    get:
      summary: Get product by ID (channel-scoped)
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: channel
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Not found or not visible in channel
    put:
      summary: Update a product
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                categoryId:
                  type: string
                  nullable: true
                attributes:
                  type: object
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      summary: Delete a product
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Product deleted
        '403':
          description: Forbidden
        '404':
          description: Not found

  /products/{id}/channel-listings:
    post:
      summary: Add or update channel listings for a product
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelListings]
              properties:
                channelListings:
                  type: array
                  items:
                    type: object
                    required: [channelSlug]
                    properties:
                      channelSlug:
                        type: string
                      isPublished:
                        type: boolean
                        default: true
                      visibleInListings:
                        type: boolean
                        default: true
      responses:
        '200':
          description: Channel listings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '403':
          description: Forbidden
        '404':
          description: Not found

  /products/{id}/variants:
    post:
      summary: Create a product variant
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sku]
              properties:
                name:
                  type: string
                sku:
                  type: string
                attributes:
                  type: object
                weight:
                  type: number
                  nullable: true
                channelListings:
                  type: array
                  items:
                    type: object
                    required: [channelSlug, price]
                    properties:
                      channelSlug:
                        type: string
                      price:
                        type: number
                      costPrice:
                        type: number
                        nullable: true
                      currencyCode:
                        type: string
      responses:
        '201':
          description: Variant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVariant'
        '403':
          description: Forbidden
        '404':
          description: Product not found
    get:
      summary: List product variants (channel-scoped)
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: channel
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of variants
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
