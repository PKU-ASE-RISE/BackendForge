openapi: 3.0.3
info:
  title: Plane - Project Management API
  description: A project management platform similar to Jira/Linear with workspaces, projects, issues, cycles, modules, and more.
  version: 1.0.0

servers:
  - url: http://localhost:8000

security:
  - apiKeyAuth: []

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkspaceCreate:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'

    WorkspaceUpdate:
      type: object
      properties:
        name:
          type: string

    WorkspaceMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [admin, member, guest]
        createdAt:
          type: string
          format: date-time

    WorkspaceMemberCreate:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [admin, member, guest]

    WorkspaceMemberUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member, guest]

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        identifier:
          type: string
        description:
          type: string
        workspaceId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required: [name, identifier]
      properties:
        name:
          type: string
        identifier:
          type: string
          pattern: '^[A-Z]{2,5}$'
        description:
          type: string

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    ProjectMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        role:
          type: string
          enum: [admin, member, guest]
        createdAt:
          type: string
          format: date-time

    ProjectMemberCreate:
      type: object
      required: [memberId, role]
      properties:
        memberId:
          type: string
          format: uuid
        role:
          type: string
          enum: [admin, member, guest]

    State:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        group:
          type: string
          enum: [backlog, unstarted, started, completed, cancelled]
        color:
          type: string
        order:
          type: number
        projectId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    StateCreate:
      type: object
      required: [name, group]
      properties:
        name:
          type: string
        group:
          type: string
          enum: [backlog, unstarted, started, completed, cancelled]
        color:
          type: string
        order:
          type: number

    StateUpdate:
      type: object
      properties:
        name:
          type: string
        group:
          type: string
          enum: [backlog, unstarted, started, completed, cancelled]
        color:
          type: string
        order:
          type: number

    Label:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        projectId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    LabelCreate:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
        color:
          type: string

    LabelUpdate:
      type: object
      properties:
        name:
          type: string
        color:
          type: string

    Issue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        identifier:
          type: string
        name:
          type: string
        description:
          type: string
        stateId:
          type: string
          format: uuid
        priority:
          type: string
          enum: [urgent, high, medium, low, none]
        assignees:
          type: array
          items:
            type: string
            format: uuid
        labels:
          type: array
          items:
            type: string
            format: uuid
        dueDate:
          type: string
          format: date
          nullable: true
        estimate:
          type: integer
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true
        projectId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    IssueCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        stateId:
          type: string
          format: uuid
        priority:
          type: string
          enum: [urgent, high, medium, low, none]
        assignees:
          type: array
          items:
            type: string
            format: uuid
        labels:
          type: array
          items:
            type: string
            format: uuid
        dueDate:
          type: string
          format: date
        estimate:
          type: integer
        parentId:
          type: string
          format: uuid

    IssueUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        stateId:
          type: string
          format: uuid
        priority:
          type: string
          enum: [urgent, high, medium, low, none]
        assignees:
          type: array
          items:
            type: string
            format: uuid
        labels:
          type: array
          items:
            type: string
            format: uuid
        dueDate:
          type: string
          format: date
          nullable: true
        estimate:
          type: integer
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        issueId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CommentCreate:
      type: object
      required: [content]
      properties:
        content:
          type: string

    CommentUpdate:
      type: object
      required: [content]
      properties:
        content:
          type: string

    Reaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        emoji:
          type: string
        commentId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    ReactionCreate:
      type: object
      required: [emoji]
      properties:
        emoji:
          type: string

    Cycle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        projectId:
          type: string
          format: uuid
        totalIssues:
          type: integer
        completedIssues:
          type: integer
        pendingIssues:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CycleCreate:
      type: object
      required: [name, startDate, endDate]
      properties:
        name:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    CycleUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    CycleIssueAdd:
      type: object
      required: [issueId]
      properties:
        issueId:
          type: string
          format: uuid

    Module:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        projectId:
          type: string
          format: uuid
        totalIssues:
          type: integer
        completedIssues:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ModuleCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    ModuleUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    ModuleIssueAdd:
      type: object
      required: [issueId]
      properties:
        issueId:
          type: string
          format: uuid

    View:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        filters:
          type: object
          properties:
            stateId:
              type: string
              format: uuid
            priority:
              type: string
              enum: [urgent, high, medium, low, none]
            assignees:
              type: array
              items:
                type: string
                format: uuid
            labels:
              type: array
              items:
                type: string
                format: uuid
            dueDateStart:
              type: string
              format: date
            dueDateEnd:
              type: string
              format: date
        projectId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    ViewCreate:
      type: object
      required: [name, filters]
      properties:
        name:
          type: string
        filters:
          type: object

    ViewUpdate:
      type: object
      properties:
        name:
          type: string
        filters:
          type: object

    Page:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
        projectId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PageCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        content:
          type: string
        parentId:
          type: string
          format: uuid

    PageUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true

    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        issueId:
          type: string
          format: uuid
        field:
          type: string
        oldValue:
          type: string
          nullable: true
        newValue:
          type: string
          nullable: true
        actorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        detail:
          type: string

paths:
  /api/workspaces:
    post:
      summary: Create workspace
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          description: Unauthorized
        '409':
          description: Slug already exists
    get:
      summary: List workspaces for current user
      operationId: listWorkspaces
      responses:
        '200':
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '401':
          description: Unauthorized

  /api/workspaces/{workspaceSlug}:
    parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get workspace details
      operationId: getWorkspace
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    patch:
      summary: Update workspace
      operationId: updateWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
        '404':
          description: Not found
    delete:
      summary: Delete workspace
      operationId: deleteWorkspace
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
        '404':
          description: Not found

  /api/workspaces/{workspaceSlug}/members:
    parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Add workspace member
      operationId: addWorkspaceMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberCreate'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
        '409':
          description: User already a member
    get:
      summary: List workspace members
      operationId: listWorkspaceMembers
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMember'
        '401':
          description: Unauthorized

  /api/workspaces/{workspaceSlug}/members/{memberId}:
    parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Update member role
      operationId: updateWorkspaceMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberUpdate'
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
        '404':
          description: Not found
    delete:
      summary: Remove workspace member
      operationId: removeWorkspaceMember
      responses:
        '204':
          description: Member removed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
        '404':
          description: Not found

  /api/workspaces/{workspaceSlug}/projects:
    parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Create project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
        '409':
          description: Identifier already exists in workspace
    get:
      summary: List projects in workspace
      operationId: listProjects
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized

  /api/workspaces/{workspaceSlug}/projects/{projectId}:
    parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get project details
      operationId: getProject
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    patch:
      summary: Update project
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
        '404':
          description: Not found
    delete:
      summary: Delete project
      operationId: deleteProject
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
        '404':
          description: Not found

  /api/workspaces/{workspaceSlug}/projects/{projectId}/members:
    parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Add project member
      operationId: addProjectMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberCreate'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMember'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
    get:
      summary: List project members
      operationId: listProjectMembers
      responses:
        '200':
          description: List of project members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
        '401':
          description: Unauthorized

  /api/workspaces/{workspaceSlug}/projects/{projectId}/members/{memberId}:
    parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Remove project member
      operationId: removeProjectMember
      responses:
        '204':
          description: Removed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
        '404':
          description: Not found

  /api/workspaces/{workspaceSlug}/projects/{projectId}/states:
    parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Create state
      operationId: createState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateCreate'
      responses:
        '201':
          description: State created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
    get:
      summary: List states
      operationId: listStates
      responses:
        '200':
          description: List of states ordered by order field
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/State'
        '401':
          description: Unauthorized

  /api/workspaces/{workspaceSlug}/projects/{projectId}/states/{stateId}:
    parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: stateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get state
      operationId: getState
      responses:
        '200':
          description: State details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    patch:
      summary: Update state
      operationId: updateState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateUpdate'
      responses:
        '200':
          description: Updated state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
        '404':
          description: Not found
    delete:
      summary: Delete state
      operationId: deleteState
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
        '404':
          description: Not found

  /api/workspaces/{workspaceSlug}/projects/{projectId}/labels:
    parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Create label
      operationId: createLabel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelCreate'
      responses:
        '201':
          description: Label created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
    get:
      summary: List labels
      operationId: listLabels
      responses:
        '200':
          description: List of labels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Label'
        '401':
          description: Unauthorized

  /api/workspaces/{workspaceSlug}/projects/{projectId}/labels/{labelId}:
    parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: labelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get label
      operationId: getLabel
      responses:
        '200':
          description: Label details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    patch:
      summary: Update label
      operationId: updateLabel
      requestBody:
        required: true
        content:
