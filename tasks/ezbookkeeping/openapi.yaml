openapi: 3.0.3
info:
  title: EZBookkeeping REST API
  description: Personal finance and expense tracking
  version: "1.0.0"

servers:
  - url: http://localhost:8000

security:
  - UserIdAuth: []

components:
  securitySchemes:
    UserIdAuth:
      type: apiKey
      in: header
      name: X-User-Id

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    Account:
      type: object
      required:
        - id
        - name
        - type
        - currency
        - icon
        - balance
        - displayOrder
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        type:
          type: string
          enum: [cash, checking, savings, credit_card, investment]
        currency:
          type: string
          example: USD
        icon:
          type: string
        balance:
          type: number
          format: double
          readOnly: true
        displayOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    AccountCreate:
      type: object
      required:
        - name
        - type
        - currency
      properties:
        name:
          type: string
        type:
          type: string
          enum: [cash, checking, savings, credit_card, investment]
        currency:
          type: string
          example: USD
        icon:
          type: string
          default: ""
        displayOrder:
          type: integer
          default: 0

    AccountUpdate:
      type: object
      required:
        - name
        - type
        - currency
      properties:
        name:
          type: string
        type:
          type: string
          enum: [cash, checking, savings, credit_card, investment]
        currency:
          type: string
        icon:
          type: string
        displayOrder:
          type: integer

    Category:
      type: object
      required:
        - id
        - name
        - type
        - icon
        - color
        - parentId
        - displayOrder
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        type:
          type: string
          enum: [income, expense, transfer]
        icon:
          type: string
        color:
          type: string
          example: "#FF5733"
        parentId:
          type: string
          format: uuid
          nullable: true
        displayOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CategoryCreate:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          enum: [income, expense, transfer]
        icon:
          type: string
          default: ""
        color:
          type: string
          default: "#000000"
        parentId:
          type: string
          format: uuid
          nullable: true
        displayOrder:
          type: integer
          default: 0

    CategoryUpdate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        displayOrder:
          type: integer

    Tag:
      type: object
      required:
        - id
        - name
        - displayOrder
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        displayOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    TagCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        displayOrder:
          type: integer
          default: 0

    TagUpdate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        displayOrder:
          type: integer

    Transaction:
      type: object
      required:
        - id
        - type
        - amount
        - accountId
        - categoryId
        - tagIds
        - date
        - time
        - comment
        - destinationAccountId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          enum: [income, expense, transfer]
        amount:
          type: number
          format: double
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        tagIds:
          type: array
          items:
            type: string
            format: uuid
        date:
          type: string
          example: "2024-01-15"
        time:
          type: string
          example: "14:30:00"
        comment:
          type: string
        destinationAccountId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    TransactionCreate:
      type: object
      required:
        - type
        - amount
        - accountId
        - categoryId
        - date
        - time
      properties:
        type:
          type: string
          enum: [income, expense, transfer]
        amount:
          type: number
          format: double
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        tagIds:
          type: array
          items:
            type: string
            format: uuid
          default: []
        date:
          type: string
          example: "2024-01-15"
        time:
          type: string
          example: "14:30:00"
        comment:
          type: string
          default: ""
        destinationAccountId:
          type: string
          format: uuid
          nullable: true

    TransactionUpdate:
      type: object
      required:
        - type
        - amount
        - accountId
        - categoryId
        - date
        - time
      properties:
        type:
          type: string
          enum: [income, expense, transfer]
        amount:
          type: number
          format: double
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        tagIds:
          type: array
          items:
            type: string
            format: uuid
          default: []
        date:
          type: string
        time:
          type: string
        comment:
          type: string
          default: ""
        destinationAccountId:
          type: string
          format: uuid
          nullable: true

    TransactionList:
      type: object
      required:
        - transactions
        - total
        - offset
        - limit
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    MonthlySummary:
      type: object
      required:
        - month
        - totalIncome
        - totalExpense
        - net
      properties:
        month:
          type: string
          example: "2024-01"
        totalIncome:
          type: number
          format: double
        totalExpense:
          type: number
          format: double
        net:
          type: number
          format: double

    CategoryBreakdownItem:
      type: object
      required:
        - categoryId
        - categoryName
        - amount
      properties:
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        amount:
          type: number
          format: double

    ExchangeRates:
      type: object
      required:
        - base
        - rates
      properties:
        base:
          type: string
          example: USD
        rates:
          type: object
          additionalProperties:
            type: number
            format: double

paths:
  /health:
    get:
      operationId: getHealth
      summary: Get health status
      security: []
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /accounts:
    get:
      operationId: listAccounts
      summary: List all accounts for the current user
      responses:
        "200":
          description: Array of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createAccount
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        "201":
          description: The created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts/{id}:
    get:
      operationId: getAccount
      summary: Get a single account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateAccount
      summary: Update an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteAccount
      summary: Delete an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Account deleted
        "400":
          description: Bad Request (account has transactions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /categories:
    get:
      operationId: listCategories
      summary: List all categories for the current user
      responses:
        "200":
          description: Array of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createCategory
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        "201":
          description: The created category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /categories/{id}:
    get:
      operationId: getCategory
      summary: Get a single category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateCategory
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        "200":
          description: The updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteCategory
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Category deleted
        "400":
          description: Bad Request (category has transactions or children)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tags:
    get:
      operationId: listTags
      summary: List all tags for the current user
      responses:
        "200":
          description: Array of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createTag
      summary: Create a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreate'
      responses:
        "201":
          description: The created tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tags/{id}:
    get:
      operationId: getTag
      summary: Get a single tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateTag
      summary: Update a tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdate'
      responses:
        "200":
          description: The updated tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteTag
      summary: Delete a tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Tag deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transactions:
    get:
      operationId: listTransactions
      summary: List transactions with filters and pagination
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: tagId
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            type: string
            enum: [income, expense, transfer]
        - name: startDate
          in: query
          schema:
            type: string
            example: "2024-01-01"
        - name: endDate
          in: query
          schema:
            type: string
            example: "2024-12-31"
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Paginated list of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createTransaction
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
      responses:
        "201":
          description: The created transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transactions/{id}:
    get:
      operationId: getTransaction
      summary: Get a single transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateTransaction
      summary: Update a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdate'
      responses:
        "200":
          description: The updated transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteTransaction
      summary: Delete a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Transaction deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transactions/export:
    get:
      operationId: exportTransactions
      summary: Export transactions as CSV
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: tagId
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            type: string
            enum: [income, expense, transfer]
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /statistics/monthly:
    get:
      operationId: getMonthlyStatistics
      summary: Get monthly income/expense summary
      parameters:
        - name: startMonth
          in: query
          required: true
          schema:
            type: string
            example: "2024-01"
        - name: endMonth
          in: query
          required: true
          schema:
            type: string
            example: "2024-12"
      responses:
        "200":
          description: Array of monthly summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonthlySummary'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /statistics/category:
    get:
      operationId: getCategoryStatistics
      summary: Get category breakdown for a month
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            example: "2024-01"
        - name: type
          in: query
          schema:
            type: string
            enum: [income, expense]
            default: expense
      responses:
        "200":
          description: Array of category breakdowns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryBreakdownItem'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /statistics/trends:
    get:
      operationId: getTrends
      summary: Get monthly trends over a range
      parameters:
        - name: startMonth
          in: query
          required: true
          schema:
            type: string
            example: "2024-01"
        - name: endMonth
          in: query
          required: true
          schema:
            type: string
            example: "2024-12"
      responses:
        "200":
          description: Array of monthly summaries (same schema as monthly)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonthlySummary'
        "401":
          description: Unauthorized
          content:
            application/json:
