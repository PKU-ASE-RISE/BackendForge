openapi: 3.0.3
info:
  title: Gotify REST-API
  description: Self-hosted push notification server
  version: "2.6.1"

servers:
  - url: http://localhost:8000

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Gotify-Key

  schemas:
    Error:
      type: object
      required:
        - error
        - errorCode
        - errorDescription
      properties:
        error:
          type: string
        errorCode:
          type: integer
          format: int64
        errorDescription:
          type: string

    Application:
      type: object
      required:
        - id
        - token
        - name
        - description
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        token:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
        defaultPriority:
          type: integer
          format: int64
        lastUsed:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    ApplicationParams:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          default: ""
        defaultPriority:
          type: integer
          format: int64
          default: 0

    Message:
      type: object
      required:
        - id
        - appid
        - message
        - date
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        appid:
          type: integer
          format: int64
        title:
          type: string
        message:
          type: string
        priority:
          type: integer
          format: int64
        date:
          type: string
          format: date-time
          readOnly: true
        extras:
          type: object
          additionalProperties: {}

    MessageParams:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        title:
          type: string
          default: ""
        priority:
          type: integer
          format: int64
          default: 0
        extras:
          type: object
          additionalProperties: {}
        appid:
          type: integer
          format: int64

    PagedMessages:
      type: object
      required:
        - paging
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        paging:
          $ref: '#/components/schemas/Paging'

    Paging:
      type: object
      required:
        - size
        - since
        - limit
      properties:
        size:
          type: integer
          format: int64
          description: Number of messages returned in this response
        since:
          type: integer
          format: int64
          description: The ID used as since parameter in this request
        limit:
          type: integer
          format: int64
          description: The limit used in this request
        next:
          type: string
          description: URL for the next page of results, or empty string if no more

    Client:
      type: object
      required:
        - id
        - token
        - name
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        token:
          type: string
          readOnly: true
        name:
          type: string
        lastUsed:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    ClientParams:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    User:
      type: object
      required:
        - id
        - name
        - admin
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        admin:
          type: boolean

    CreateUserParams:
      type: object
      required:
        - name
        - pass
        - admin
      properties:
        name:
          type: string
        pass:
          type: string
        admin:
          type: boolean

    UpdateUserParams:
      type: object
      required:
        - name
        - admin
      properties:
        name:
          type: string
        pass:
          type: string
          description: If empty or omitted, the password is not changed
        admin:
          type: boolean

    Health:
      type: object
      required:
        - health
        - database
      properties:
        health:
          type: string
          example: green
        database:
          type: string
          example: green

    VersionInfo:
      type: object
      required:
        - version
        - commit
        - buildDate
      properties:
        version:
          type: string
        commit:
          type: string
        buildDate:
          type: string

paths:
  /health:
    get:
      operationId: getHealth
      summary: Get health information
      security: []
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /version:
    get:
      operationId: getVersion
      summary: Get version information
      security: []
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'

  /applications:
    get:
      operationId: getApplications
      summary: Return all applications for the current user
      responses:
        "200":
          description: Array of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createApplication
      summary: Create an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationParams'
      responses:
        "200":
          description: The created application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/{id}:
    put:
      operationId: updateApplication
      summary: Update an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationParams'
      responses:
        "200":
          description: The updated application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteApplication
      summary: Delete an application and all its messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Application deleted
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications/{id}/messages:
    get:
      operationId: getAppMessages
      summary: Return all messages from a specific application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 200
            default: 100
        - name: since
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: Paged messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMessages'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteAppMessages
      summary: Delete all messages from a specific application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Messages deleted
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /messages:
    get:
      operationId: getMessages
      summary: Return all messages for the current user
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 200
            default: 100
        - name: since
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: Paged messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMessages'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createMessage
      summary: Create a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageParams'
      responses:
        "200":
          description: The created message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteMessages
      summary: Delete all messages for the current user
      responses:
        "200":
          description: Messages deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /messages/{id}:
    delete:
      operationId: deleteMessage
      summary: Delete a message by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Message deleted
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clients:
    get:
      operationId: getClients
      summary: Return all clients for the current user
      responses:
        "200":
          description: Array of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createClient
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientParams'
      responses:
        "200":
          description: The created client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clients/{id}:
    put:
      operationId: updateClient
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientParams'
      responses:
        "200":
          description: The updated client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteClient
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Client deleted
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users:
    get:
      operationId: getUsers
      summary: Return all users (admin only)
      responses:
        "200":
          description: Array of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createUser
      summary: Create a user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserParams'
      responses:
        "200":
          description: The created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    get:
      operationId: getUser
      summary: Get a user by ID (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateUser
      summary: Update a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserParams'
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteUser
      summary: Delete a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: User deleted
        "400":
          description: Bad Request (e.g. cannot delete self)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /current/user:
    get:
      operationId: getCurrentUser
      summary: Return the current user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
