openapi: 3.0.3
info:
  title: Twenty CRM API
  description: Modern CRM platform with custom objects, pipelines, and activity tracking
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local development

security:
  - apiKey: []

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        totalCount:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        companyId:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string
        city:
          type: string
        jobTitle:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PersonCreate:
      type: object
      required:
        - firstName
        - lastName
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        companyId:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
        city:
          type: string
        jobTitle:
          type: string

    PersonUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        companyId:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string
        city:
          type: string
        jobTitle:
          type: string

    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        domain:
          type: string
        size:
          type: string
        industry:
          type: string
        annualRevenue:
          type: number
        totalRevenue:
          type: number
        address:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CompanyCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        domain:
          type: string
        size:
          type: string
        industry:
          type: string
        annualRevenue:
          type: number
        address:
          type: string

    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
        domain:
          type: string
        size:
          type: string
        industry:
          type: string
        annualRevenue:
          type: number
        address:
          type: string

    Stage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
        color:
          type: string

    StageCreate:
      type: object
      required:
        - name
        - position
      properties:
        name:
          type: string
        position:
          type: integer
        color:
          type: string

    StageUpdate:
      type: object
      properties:
        name:
          type: string
        position:
          type: integer
        color:
          type: string

    Pipeline:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/Stage'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PipelineCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageCreate'

    PipelineUpdate:
      type: object
      properties:
        name:
          type: string

    Opportunity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        amount:
          type: number
        companyId:
          type: string
          format: uuid
          nullable: true
        pipelineId:
          type: string
          format: uuid
        stageId:
          type: string
          format: uuid
        probability:
          type: number
        closeDate:
          type: string
          format: date
        closedAt:
          type: string
          format: date-time
          nullable: true
        owner:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OpportunityCreate:
      type: object
      required:
        - name
        - pipelineId
        - stageId
      properties:
        name:
          type: string
        amount:
          type: number
        companyId:
          type: string
          format: uuid
        pipelineId:
          type: string
          format: uuid
        stageId:
          type: string
          format: uuid
        probability:
          type: number
        closeDate:
          type: string
          format: date
        owner:
          type: string

    OpportunityUpdate:
      type: object
      properties:
        name:
          type: string
        amount:
          type: number
        companyId:
          type: string
          format: uuid
          nullable: true
        stageId:
          type: string
          format: uuid
        probability:
          type: number
        closeDate:
          type: string
          format: date
        owner:
          type: string

    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [call, email, meeting, task]
        title:
          type: string
        body:
          type: string
        dueDate:
          type: string
          format: date-time
        completed:
          type: boolean
        personId:
          type: string
          format: uuid
          nullable: true
        companyId:
          type: string
          format: uuid
          nullable: true
        opportunityId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ActivityCreate:
      type: object
      required:
        - type
        - title
      properties:
        type:
          type: string
          enum: [call, email, meeting, task]
        title:
          type: string
        body:
          type: string
        dueDate:
          type: string
          format: date-time
        completed:
          type: boolean
        personId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        opportunityId:
          type: string
          format: uuid

    ActivityUpdate:
      type: object
      properties:
        type:
          type: string
          enum: [call, email, meeting, task]
        title:
          type: string
        body:
          type: string
        dueDate:
          type: string
          format: date-time
        completed:
          type: boolean
        personId:
          type: string
          format: uuid
          nullable: true
        companyId:
          type: string
          format: uuid
          nullable: true
        opportunityId:
          type: string
          format: uuid
          nullable: true

    Note:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        personId:
          type: string
          format: uuid
          nullable: true
        companyId:
          type: string
          format: uuid
          nullable: true
        opportunityId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NoteCreate:
      type: object
      required:
        - body
      properties:
        title:
          type: string
        body:
          type: string
        personId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        opportunityId:
          type: string
          format: uuid

    NoteUpdate:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        personId:
          type: string
          format: uuid
          nullable: true
        companyId:
          type: string
          format: uuid
          nullable: true
        opportunityId:
          type: string
          format: uuid
          nullable: true

    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        createdAt:
          type: string
          format: date-time

    TagCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        color:
          type: string

    TagUpdate:
      type: object
      properties:
        name:
          type: string
        color:
          type: string

    Filter:
      type: object
      properties:
        field:
          type: string
        operator:
          type: string
          enum: [eq, neq, gt, gte, lt, lte, contains, in]
        value: {}

    Sort:
      type: object
      properties:
        field:
          type: string
        direction:
          type: string
          enum: [asc, desc]

    View:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        objectType:
          type: string
          enum: [people, companies, opportunities]
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
        sorts:
          type: array
          items:
            $ref: '#/components/schemas/Sort'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ViewCreate:
      type: object
      required:
        - name
        - objectType
      properties:
        name:
          type: string
        objectType:
          type: string
          enum: [people, companies, opportunities]
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
        sorts:
          type: array
          items:
            $ref: '#/components/schemas/Sort'

    ViewUpdate:
      type: object
      properties:
        name:
          type: string
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
        sorts:
          type: array
          items:
            $ref: '#/components/schemas/Sort'

    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        createdAt:
          type: string
          format: date-time

    MemberCreate:
      type: object
      required:
        - email
        - name
        - role
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, admin, member]

    MemberUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [owner, admin, member]

    CustomField:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        label:
          type: string
        objectType:
          type: string
          enum: [people, companies, opportunities]
        type:
          type: string
          enum: [text, number, date, select]
        options:
          type: array
          items:
            type: string
        required:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CustomFieldCreate:
      type: object
      required:
        - name
        - label
        - objectType
        - type
      properties:
        name:
          type: string
        label:
          type: string
        objectType:
          type: string
          enum: [people, companies, opportunities]
        type:
          type: string
          enum: [text, number, date, select]
        options:
          type: array
          items:
            type: string
        required:
          type: boolean

    SearchResults:
      type: object
      properties:
        people:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        companies:
          type: array
          items:
            $ref: '#/components/schemas/Company'
        opportunities:
          type: array
          items:
            $ref: '#/components/schemas/Opportunity'

paths:
  /people:
    get:
      summary: List people
      operationId: listPeople
      tags: [People]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: companyId
          in: query
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of people
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Person'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create a person
      operationId: createPerson
      tags: [People]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonCreate'
      responses:
        '201':
          description: Person created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized

  /people/{id}:
    get:
      summary: Get a person
      operationId: getPerson
      tags: [People]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Person details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          description: Not found

    patch:
      summary: Update a person
      operationId: updatePerson
      tags: [People]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonUpdate'
      responses:
        '200':
          description: Person updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          description: Not found

    delete:
      summary: Delete a person
      operationId: deletePerson
      tags: [People]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Person deleted
        '404':
          description: Not found

  /people/{id}/activities:
    get:
      summary: Get activities for a person
      operationId: getPersonActivities
      tags: [People]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of activities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Activity'

  /people/{id}/notes:
    get:
      summary: Get notes for a person
      operationId: getPersonNotes
      tags: [People]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'

  /companies:
    get:
      summary: List companies
      operationId: listCompanies
      tags: [Companies]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated list of companies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Company'

    post:
      summary: Create a company
      operationId: createCompany
      tags: [Companies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
      responses:
        '201':
          description: Company created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Validation error

  /companies/{id}:
    get:
      summary: Get a company
      operationId: getCompany
      tags: [Companies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Company details with totalRevenue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '404':
          description: Not found

    patch:
      summary: Update a company
      operationId: updateCompany
      tags: [Companies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdate'
      responses:
        '200':
          description: Company updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '404':
          description: Not found

    delete:
      summary: Delete a company
      operationId: deleteCompany
      tags: [Companies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Company deleted
        '404':
          description: Not found

  /companies/{id}/people:
    get:
      summary: Get people at a company
      operationId: getCompanyPeople
      tags: [Companies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of people at company
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Person'

  /companies/{id}/activities:
    get:
      summary: Get activities for a company
      operationId: getCompanyActivities
      tags: [Companies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of activities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Activity'

  /companies/{id}/notes:
    get:
      summary: Get notes for a company
      operationId: getCompanyNotes
      tags: [Companies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'

  /pipelines:
    get:
      summary: List pipelines
      operationId: listPipelines
      tags: [Pipelines]
      responses:
        '200':
          description: List of pipelines
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pipeline'
        '403':
          description: Forbidden (requires admin+)

    post:
      summary: Create a pipeline
      operationId: createPipeline
      tags: [Pipelines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineCreate'
      responses:
        '201':
          description: Pipeline created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        '403':
          description: Forbidden (requires admin+)

  /pipelines/{id}:
    get:
      summary: Get a pipeline with stages
      operationId: getPipeline
      tags: [Pipelines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pipeline details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        '403':
          description: Forbidden
        '404':
          description: Not found

    patch:
      summary: Update a pipeline
      operationId: updatePipeline
      tags: [Pipelines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineUpdate'
      responses:
        '200':
          description: Pipeline updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        '403':
          description: Forbidden
        '404':
          description: Not found

    delete:
      summary: Delete a pipeline
      operationId: deletePipeline
      tags: [Pipelines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Pipeline deleted
        '403':
          description: Forbidden
        '404':
          description: Not found

  /pipelines/{id}/stages:
    post:
      summary: Add a stage to a pipeline
      operationId: createStage
      tags: [Pipelines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageCreate'
      responses:
        '201':
          description: Stage created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '403':
          description: Forbidden
        '404':
          description: Pipeline not found

  /pipelines/{id}/stages/{stageId}:
    patch:
      summary: Update a stage
      operationId: updateStage
      tags: [Pipelines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: stageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageUpdate'
      responses:
        '200':
          description: Stage updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '403':
          description: Forbidden
        '404':
          description: Not found

    delete:
      summary: Delete a stage
      operationId: deleteStage
      tags: [Pipelines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: stageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Stage deleted
        '403':
          description: Forbidden
        '404':
          description: Not found

  /opportunities:
    get:
      summary: List opportunities
      operationId: listOpportunities
